<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1622" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shanghai">
<title>China 2026 Trip</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="China trip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6e9ec; --card: #ffffff; --ink: #14202e; --muted: #5b6673; --line: #d3d8de; --rail-bg: #f1f3f5;
    --shadow: 0 2px 0 rgba(20,32,46,.06), 0 18px 40px -18px rgba(20,32,46,.35);
    --c: #6b7785; --ct: #4a5563;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0c1622; --card: #15212f; --ink: #e8edf2; --muted: #93a0ae; --line: #26364a; --rail-bg: #1b2938; --shadow: 0 18px 40px -18px rgba(0,0,0,.8); }
  }
  :root[data-theme="dark"] { --bg: #0c1622; --card: #15212f; --ink: #e8edf2; --muted: #93a0ae; --line: #26364a; --rail-bg: #1b2938; --shadow: 0 18px 40px -18px rgba(0,0,0,.8); }
  .card { --at: var(--ct); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { --at: color-mix(in srgb, var(--c) 55%, #fff); } }
  :root[data-theme="dark"] .card { --at: color-mix(in srgb, var(--c) 55%, #fff); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15.5px/1.5 Archivo, "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .zh { font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--c); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  /* Top bar: line roundels */
  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--card);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand h1 { margin: 0; font: 800 18px/1 Archivo, sans-serif; font-stretch: 75%; display: flex; align-items: baseline; gap: 7px; }
  .brand h1 .zh { font-weight: 900; font-size: 18px; }
  .brand h1 small { font-weight: 500; color: var(--muted); font-size: 14px; font-stretch: 100%; }
  .tabs { display: flex; gap: 12px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding: 8px 6px 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 5px; font: 500 12px/1 Archivo, sans-serif;
  }
  .tab .roundel {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--tc); color: #fff; font: 800 19px/1 Archivo, sans-serif; font-stretch: 80%;
    box-shadow: 0 0 0 3px var(--card); transition: box-shadow .2s, transform .2s;
  }
  .tab.active .roundel { box-shadow: 0 0 0 3px var(--card), 0 0 0 5.5px var(--tc); transform: scale(1.05); }
  .tab small { color: var(--muted); }
  .tab.active small { color: var(--ink); font-weight: 700; }
  .tab.today small { color: var(--tc); font-weight: 800; }

  /* Deck */
  .deck { padding: 18px 0 48px; overflow-x: hidden; }
  .slot { padding: 0 14px; display: flex; justify-content: center; }
  .slot.in-right { animation: inRight .22s ease-out; }
  .slot.in-left { animation: inLeft .22s ease-out; }
  @keyframes inRight { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes inLeft { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .slot { animation: none !important; } }
  .card {
    width: 100%; max-width: 560px; background: var(--card); border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow);
  }

  /* Hero: the station sign */
  .hero { background: var(--c); color: #fff; padding: 18px 20px 0; overflow: hidden; }
  .sign-top { display: flex; justify-content: space-between; align-items: center; font: 600 14px/1 Archivo, sans-serif; }
  .sign-top .badge { display: inline-flex; align-items: center; gap: 9px; }
  .sign-top .badge b { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--ct); display: grid; place-items: center; font: 800 16px/1 Archivo, sans-serif; font-stretch: 80%; }
  .hero .zh-big { font: 900 clamp(78px, 26vw, 136px)/.9 "Noto Sans SC", sans-serif; letter-spacing: -.03em; margin: 20px 0 0 -5px; white-space: nowrap; }
  .hero .area { font: 800 27px/1.05 Archivo, sans-serif; font-stretch: 68%; margin: 12px 0 18px; }
  .platform { background: var(--card); color: var(--ink); margin: 0 -20px; padding: 18px 20px; border-top: 7px solid var(--ink); }
  .platform h2 { font: 800 25px/1.12 Archivo, sans-serif; font-stretch: 85%; margin: 0 0 8px; }
  .platform p { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
  .highlights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { font: 600 13px/1 Archivo, sans-serif; padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--c); color: var(--at); }

  /* The line diagram */
  .section { padding: 2px 18px 4px; }
  .section h3 { font: 800 17px/1 Archivo, sans-serif; font-stretch: 80%; margin: 14px 0 18px; }
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 63px; top: 10px; bottom: 22px; width: 6px; background: var(--c); border-radius: 3px; }
  .stop { display: grid; grid-template-columns: 48px 1fr; gap: 38px; padding: 0 0 22px; position: relative; }
  .stop .time { font: 800 14.5px/1.2 Archivo, sans-serif; font-stretch: 78%; text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .stop .dot { position: absolute; left: 57px; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 4px solid var(--c); }
  .stop.major .dot { width: 26px; height: 26px; left: 53px; top: -3px; border-width: 5px; box-shadow: 0 0 0 3px var(--card); }
  .stop.t-book .dot { background: var(--ink); border-color: var(--ink); }
  .stop .body { min-width: 0; }
  .tag { display: block; font: 600 13px/1 Archivo, sans-serif; color: var(--at); margin-bottom: 5px; }
  .t-book .tag { color: var(--ink); font-weight: 800; }
  .stop .title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .stop.major .title { font: 800 19px/1.2 Archivo, sans-serif; font-stretch: 85%; }
  .stop .detail { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .stop .addr { font-size: 13px; color: var(--muted); margin-top: 7px; padding-left: 10px; border-left: 2px solid var(--line); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: 700 13px/1 Archivo, sans-serif; padding: 8px 12px 8px 10px; border-radius: 999px;
    background: var(--ink); color: var(--card);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:active { transform: scale(.97); }

  /* About this place */
  .about { margin-top: 10px; }
  .about + .about { margin-top: 8px; }
  .about summary { list-style: none; cursor: pointer; font: 700 13.5px/1 Archivo, sans-serif; color: var(--at); display: inline-flex; align-items: center; gap: 7px; }
  .about summary::-webkit-details-marker { display: none; }
  .about summary::before { content: "i"; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; font: italic 700 11px/1 Georgia, serif; }
  .about[open] summary { margin-bottom: 8px; }
  .about .ab { background: var(--rail-bg); border-left: 4px solid var(--c); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; }
  .about .ab p { margin: 0 0 7px; line-height: 1.55; }
  .about .ab .ab-item { padding: 0 0 12px; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .about .ab .ab-item:last-child { padding: 0; margin: 0; border: 0; }
  .about .ab .ab-item p:last-child { margin: 0; }
  .about .ab b { display: block; font-size: 14px; color: var(--at); font-weight: 800; margin-bottom: 4px; }

  /* Folding panels */
  .panel { border-top: 1px solid var(--line); }
  .panel > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary .ttl { font: 800 18px/1.1 Archivo, sans-serif; font-stretch: 80%; }
  .panel > summary .sub { display: block; font: 400 13.5px/1.35 Archivo, sans-serif; color: var(--muted); margin-top: 3px; }
  .panel > summary .plus { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 17px; transition: transform .2s; }
  .panel[open] > summary .plus { transform: rotate(45deg); }
  .notes { padding: 0 18px 16px; }
  .note { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .note:last-child { border-bottom: 0; }
  .note b { display: block; font-size: 15px; margin-bottom: 2px; }
  .note span { color: var(--muted); font-size: 14px; display: block; }
  .note span p { margin: 0 0 6px; } .note span p:last-child { margin: 0; }
  .intro-note { font-size: 14px; padding: 0 0 6px; }

  /* Other options */
  .alts { padding: 0 18px 12px; }
  .alt-group { margin: 2px 0 16px; }
  .alt-group h4 { margin: 0 0 9px; font: 700 14.5px/1.2 Archivo, sans-serif; display: flex; align-items: center; gap: 9px; }
  .alt-group h4::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--c); background: var(--card); }
  .alt { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 8px; }
  .alt .n { font-weight: 700; font-size: 15px; }
  .alt .w { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .alt .a { color: var(--muted); font-size: 13px; margin-top: 5px; }

  .card-foot { display: flex; justify-content: space-between; padding: 14px 18px 20px; border-top: 1px solid var(--line); }
  .nav-btn { background: none; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 999px; padding: 10px 16px; font: 700 14px/1 Archivo, sans-serif; cursor: pointer; }
  .nav-btn[disabled] { opacity: .25; }

  .checklist { list-style: none; padding: 0; margin: 0; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .checklist li:last-child { border-bottom: 0; }
  .checklist input { width: 22px; height: 22px; accent-color: var(--ink); margin: 0; flex: 0 0 auto; }
  .checklist .when { font: 800 15px/1 Archivo, sans-serif; font-stretch: 78%; display: block; margin-bottom: 4px; }
  .checklist label { font-size: 14.5px; }
  .checklist li.done label { text-decoration: line-through; color: var(--muted); }
  .tips { margin: 0 0 10px; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
  .tips li { margin: 7px 0; }
  .theme-toggle { background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; font: 600 12.5px/1 Archivo, sans-serif; }

  .brand h1, .city-switch button { white-space: nowrap; }
  @media (max-width: 440px) { .brand h1 small { display: none; } }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .city-switch { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .city-switch button { background: none; border: 0; color: var(--ink); padding: 6px 11px; cursor: pointer; font: 900 14px/1 "Noto Sans SC", sans-serif; }
  .city-switch button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .stop.t-tbd .title { color: var(--muted); letter-spacing: .04em; font-weight: 800; }
  .stop.t-tbd .dot { border-style: dashed; }
  .src { display: inline-block; margin-top: 4px; font: 600 12px/1.3 Archivo, sans-serif; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .btn.dp { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.dp span { font-family: "Noto Sans SC", sans-serif; font-weight: 900; }
  .ab-item + .ab-item { margin-top: 12px; }
  .history p { margin: 0 0 10px; font-size: 14.5px; max-width: 62ch; }
  figure { margin: 0 0 12px; }
  figure img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--rail-bg); }
  figcaption a { font-size: 11.5px; color: var(--muted); }
  .areas { display: grid; gap: 14px; }
  .area-card { border: 1.5px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; overflow: hidden; }
  .area-card figure { margin: 0; } .area-card figure img { border-radius: 0; aspect-ratio: 2/1; }
  .area-card figcaption { padding: 4px 14px 0; }
  .area-body { padding: 10px 14px 12px; }
  .area-body h4 { margin: 0 0 4px; font: 800 18px/1.15 Archivo, sans-serif; font-stretch: 82%; }
  .area-body h4 .zh { font-weight: 900; color: var(--muted); margin-left: 4px; }
  .area-body p { margin: 0; font-size: 14px; color: var(--muted); }
  .fine { font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
  .idea-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .idea-chips span { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: var(--rail-bg); }


  .opts { margin-top: 10px; }
  .opts-h { font: 700 13px/1 Archivo, sans-serif; color: var(--ct); margin-bottom: 7px; }
  .opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; }
  .opt .n { font-weight: 700; font-size: 15px; }
  .opt .w { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .opt .a { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .opt .actions { margin-top: 8px; }
  .opt .btn.sm { padding: 6px 10px 6px 8px; font-size: 12.5px; }
  .order { margin-top: 10px; background: var(--rail-bg); border-radius: 12px; padding: 10px 12px 6px; }
  .order ul { list-style: none; margin: 0; padding: 0; }
  .order li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .order li:first-child { border-top: 0; }
  .order li b { font: 900 15px/1.3 "Noto Sans SC", sans-serif; white-space: nowrap; }
  .li-list { padding: 0 18px 12px; }
  .li-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .li-item:last-child { border-bottom: 0; }
  .li-item .n { font-weight: 700; font-size: 15px; }
  .li-item .n .zh { font-weight: 900; color: var(--ct); margin-left: 2px; }
  .li-item .w { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .li-item .a { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .li-item .actions { margin-top: 7px; }
  .btn.sm { padding: 6px 10px 6px 8px; font-size: 12.5px; }
  .part { margin: 4px 0 18px; }
  .part h4 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; padding: 7px 12px; border-radius: 10px; background: var(--rail-bg); border-left: 6px solid var(--c); font: 800 17px/1 Archivo, sans-serif; font-stretch: 85%; }
  .part h4 small { font: 900 13px/1 "Noto Sans SC", sans-serif; color: var(--muted); }
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan .stop { display: block; padding: 14px 2px 14px 14px; border-bottom: 1px solid var(--line); }
  .plan .stop:last-child { border-bottom: 0; }
  .plan .stop .dot, .plan .stop .time { display: none; }
  .plan .stop .tag { display: flex; gap: 8px; align-items: baseline; }
  .plan .stop .hint { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .plan .stop.t-book .tag { color: var(--ink); }
  .wander { margin-top: 10px; border-left: 3px solid var(--c); padding-left: 12px; }
  .wd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .wd:first-of-type { border-top: 0; }
  .wd b { display: block; font-size: 14.5px; }
  .wd span { display: block; color: var(--muted); font-size: 13px; }
  .wd .btn { flex: 0 0 auto; }
  .band { margin: 14px -18px 6px; padding: 0 18px 4px; }
  .band > h4 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 -18px 2px; padding: 14px 18px 12px; background: color-mix(in srgb, var(--c) 13%, var(--card)); border-left: 8px solid var(--c); }
  .band .b-name { font: 800 24px/1 Archivo, sans-serif; font-stretch: 85%; color: var(--ink); }
  .band .b-zh { font: 900 15px/1 "Noto Sans SC", sans-serif; color: var(--at); }
  .band .b-time { margin-left: auto; font: 600 13px/1 Archivo, sans-serif; color: var(--muted); }
  .near { margin: 10px 0 8px; border: 1.5px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 12px; padding: 0 12px; }
  .near > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; }
  .near > summary::-webkit-details-marker { display: none; }
  .near > summary b { display: block; font: 800 15.5px/1.2 Archivo, sans-serif; }
  .near > summary small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .near > summary .plus { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; transition: transform .2s; }
  .near[open] > summary .plus { transform: rotate(45deg); }
  .near ul { list-style: none; margin: 0; padding: 0 0 6px; }
  .near li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .near li > div { min-width: 0; }
  .near li b { font-size: 15px; }
  .near li .zh { font-family: "Noto Sans SC", sans-serif; font-weight: 500; color: var(--at); font-size: 14px; }
  .near li p { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .near li .btn { flex: 0 0 auto; margin-top: 2px; }
  .kind { display: inline-block; font: 700 11.5px/1 Archivo, sans-serif; color: var(--at); border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 7px; margin: 0 0 5px; }
  .near li .kind { display: table; }
  .remind { margin: 0 18px 4px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, #F2B705 22%, var(--card)); border: 1.5px solid color-mix(in srgb, #F2B705 70%, var(--line)); }
  .remind .rm + .rm { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .remind .rm-h { display: block; font: 700 12.5px/1 Archivo, sans-serif; color: var(--muted); margin-bottom: 5px; }
  .remind b { display: block; font: 800 16px/1.25 Archivo, sans-serif; }
  .remind span:not(.rm-h) { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
  .remind .btn { margin-top: 8px; }
  .sec-sub { margin: -4px 0 10px; color: var(--muted); font-size: 14px; }
  .near.eat { border-color: color-mix(in srgb, #E0A100 55%, var(--line)); }
  .hut-list { list-style: none; margin: 0; padding: 0; }
  .hut-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .hut-list li:first-child { border-top: 0; }
  .hut-list .zh { font-family: "Noto Sans SC", sans-serif; color: var(--at); font-size: 14px; }
  .hut-list .hut-when { display: inline-block; font: 700 11.5px/1 Archivo, sans-serif; color: var(--at); border: 1.5px solid currentColor; border-radius: 999px; padding: 3px 7px; margin-left: 4px; vertical-align: 2px; }
  .hut-list p { margin: 3px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .hut-list .btn { flex: 0 0 auto; }
  .eat-sub { font: 800 13px/1 Archivo, sans-serif; color: var(--muted); margin: 12px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .eat-try { margin: 0; font-size: 14px; line-height: 1.6; }
  .eat-try a { font-weight: 700; color: var(--at); text-decoration: underline; text-underline-offset: 2px; }
  .eat-try span { color: var(--muted); }
  .eat-hint { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

// All wording lives in shanghai.js and beijing.js (loaded above). This turns it into what the page needs.

const SRC = {};

  const alts = {};
  const days = T.days.map(d => {
    const day = Object.assign({}, d);
    day.food = { intro: d.food && d.food.intro, items: ((d.food && d.food.items) || []).map(note) };
    day.places = (d.places || []).map(note);
    if (d.shopping) day.shopping = d.shopping.map(note);
    day.sights = (d.sights || []).map(note);
    day.foodIdeas = (d.foodIdeas || []).map(f => Object.assign({}, f));
    alts[d.key] = (d.otherOptions || []).map(o => [o.group, o.name, o.why, o.address || "", o.amap || ""]);
    day.stops = d.stops.map(x => {
      const s = { t: x.time, type: x.type, label: x.label, title: x.title, detail: x.detail, addr: x.address, map: x.amap,
        metro: x.metro, dp: x.dianping, url: x.bookingUrl, know: x.alsoShowNotes };
      if (x.amapLinks) s.links = x.amapLinks.map(l => [l.label, l.amap]);

    });

  });

}
const CTA = { "#C60C30": "Red Line", "#00A1DE": "Blue Line", "#62361B": "Brown Line", "#009B3A": "Green Line", "#F9461C": "Orange Line", "#522398": "Purple Line", "#E27EA6": "Pink Line", "#F9E300": "Yellow Line" };

const FOOD_WORDS = [[/coffee|espresso|roaster|cafe/i, "咖啡"], [/milk tea/i, "奶茶"], [/gelato|ice cream/i, "冰淇淋"], [/xiao long|soup dumpling/i, "小笼包"], [/sheng ?jian/i, "生煎"],
  [/jianbing|egg pancake|battercake/i, "煎饼"], [/sesame noodle/i, "麻酱面"], [/crawfish|crayfish/i, "小龙虾"], [/hot ?pot/i, "火锅"], [/peking duck|roast duck/i, "烤鸭"],

function foodKw(...texts) {

function panelHead(title, sub) {
  return `<summary><span><span class="ttl">${title}</span><span class="sub">${sub}</span></span><span class="plus" aria-hidden="true">+</span></summary>`;
}

};

// Attach each place, sight and dish note to the stop it belongs to
const cjk = n => (n.match(/[㐀-鿿]+/g) || []).join("");
const enName = n => n.split(/[㐀-鿿"“(（]/)[0].split(" & ")[0].trim().toLowerCase();
const disp = n => n.replace(/\s*\(.*\)$/, "").trim();
function enrich(days, know) {
  const index = {};
  days.forEach(d => {
    (d.sights || []).forEach(n => index[n[0]] = ["History", ...n]);
    (d.places || []).forEach(n => index[n[0]] = ["Known for", ...n]);
    (d.shopping || []).forEach(n => index[n[0]] = ["Shop", ...n]);
    (d.food.items || []).forEach(n => index[n[0]] = ["The dish", ...n]);
  });
  Object.entries(know).forEach(([dk, m]) => {
    const d = days.find(x => x.key === dk);
    Object.entries(m).forEach(([i, names]) => { if (d.stops[+i]) d.stops[+i].know = names; });
  });
  days.forEach(d => {
    const notes = [
      ...(d.sights || []).map(n => ["History", ...n]),
      ...(d.places || []).map(n => ["Known for", ...n]),
      ...(d.shopping || []).map(n => ["Shop", ...n]),
      ...(d.food.items || []).map(n => ["The dish", ...n])
    ];
    d.stops.forEach(s => {
      const hay = (s.title + " " + (s.detail || "")).toLowerCase();
      s.about = notes.filter(([kind, name]) => {
        const en = enName(name), zh = cjk(name);
        if (kind === "The dish") return zh && (hay.includes(zh) || (s.order || []).some(o => o[1].includes(zh) || zh.includes(o[1])) || (s.dp || "") === zh);
        const names = s.title + " " + (s.options || []).map(o => o[0]).join(" ");
        return (en.length >= 3 && names.toLowerCase().includes(en)) || (zh.length > 1 && names.includes(zh));
      });
      (s.know || []).forEach(k => { const hit = index[k]; if (hit && !s.about.some(x => x[1] === hit[1])) s.about.push(hit); });
    });
    // Anything that didn't match a stop still shows up: dish notes on the day's first meal, the rest on the first sight
    const shown = new Set(d.stops.flatMap(s => s.about.map(x => x[1])));
    // Leftover dish notes go on the day's first meal; leftover place notes go on the matching Explore nearby place
    const exAll = Object.values(d.explore || {}).flat();
    notes.filter(n => !shown.has(n[1])).forEach(n => {
      if (n[0] === "The dish") { const to = d.stops.find(s => s.type === "food"); if (to) to.about.push(n); return; }
      const en = enName(n[1]), zh = cjk(n[1]);
      const ex = exAll.find(x => (en.length >= 3 && (x.name + " " + (x.zh || "")).toLowerCase().includes(en)) || (zh.length > 1 && (x.zh || "").includes(zh)));
      if (ex) (ex.notes = ex.notes || []).push(n);
    });
  });
}
Object.values(CITIES).forEach(c => enrich(c.days, c.know));

// Notes about a dish say "About the food"; notes about a place, restaurant or sight say "About this place"
function aboutHTML(s) {
  if (!s.about || !s.about.length) return "";
  const box = (label, list) => list.length ? `<details class="about"><summary>${label}</summary><div class="ab">
    ${list.map(([kind, n, t]) => `<div class="ab-item"><b>${esc(disp(n))}</b>${paras(t)}${srcLink(SRC[n])}</div>`).join("")}</div></details>` : "";
  const food = s.about.filter(x => x[0] === "The dish"), place = s.about.filter(x => x[0] !== "The dish");
  const eatPlace = place.filter(x => x[0] === "Known for"), other = place.filter(x => x[0] !== "Known for");
  const where = s.type === "coffee" ? "About the cafe" : s.type === "tea" ? "About the tea house" : s.type === "food" ? (eatPlace.length > 1 ? "About the restaurants" : "About the restaurant") : "About this place";
  return s.type === "food" || s.type === "coffee" || s.type === "tea"
    ? box(where, eatPlace) + box("About the food", food) + box("About this place", other)
    : box("About this place", place) + box("About the food", food);
}

`;
  const open = rest.replace(/\s/g, "").length > 0;

    : `<div class="body">${head}</div>`}</li>`;
}

// Group stops into parts of the day instead of a strict timetable
function partOf(t, prev) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (m) { const h = +m[1]; return h < 11 ? "Morning" : h < 14 ? "Midday" : h < 17 ? "Afternoon" : "Evening"; }
  if (/^(Then|Early|Morning|6:30)$/i.test(t)) return "Morning";
  if (/^(Lunch|Midday)$/i.test(t)) return "Midday";
  if (/^(Afternoon|Later|Day)$/i.test(t)) return prev === "Morning" ? "Afternoon" : prev || "Afternoon";
  if (/^(Dinner|Evening|Night)$/i.test(t)) return "Evening";
  return prev || "Morning";
}
// Food and coffee stops get their own section, grouped by meal
function mealOf(s) {
  if (s.type === "coffee") return "Coffee";
  if (s.type !== "food" && !(s.type === "tbd" && /^(breakfast|lunch|dinner)$/i.test(s.label))) return null;
  const k = (s.t + " " + s.label).toLowerCase();
  if (/breakfast/.test(k)) return "Breakfast";
  if (/snack/.test(k)) return "Snack";
  if (/lunch/.test(k)) return "Lunch";
  if (/dinner/.test(k)) return "Dinner";
  const m = /^(\d{1,2}):/.exec(s.t);
  if (m) return +m[1] < 11 ? "Breakfast" : +m[1] < 15 ? "Lunch" : +m[1] < 17 ? "Snack" : "Dinner";
  return "Snack";
}
const MEALS = [["Breakfast", "早餐"], ["Coffee", "咖啡"], ["Lunch", "午餐"], ["Snack", "小吃"], ["Dinner", "晚餐"]];
function ideasHTML(ideas) {

  return `<details class="ideas"><summary><span><b>Not feeling it?</b><small>${ideas.length} backups near today's route</small></span><span class="plus" aria-hidden="true">+</span></summary>
    ${groups.map(([m, list]) => `<div class="opts-h">${m}</div>${list.map(f => `<div class="opt">
      <div class="n">${esc(f.dish)}</div><div class="w"><b>${esc(f.name)}</b>: ${esc(f.why || "")}</div>${f.address ? `<div class="a">${esc(f.address)}</div>` : ""}
      <div class="actions">${f.amap ? `<a class="btn sm" href="${amap(f.amap)}" target="_blank" rel="noopener">${pinIcon}Amap</a>` : ""}${dpBtn((f.name.match(/[㐀-鿿]+/g) || []).join("") || (f.dish.match(/[㐀-鿿]+/g) || []).join("") || f.name).replace('class="btn dp"', 'class="btn dp sm"')}</div></div>`).join("")}`).join("")}
  </details>`;
}
function foodHTML(stops, ideas) {
  if (!stops.length && !(ideas && ideas.length)) return "";
  return `<div class="section food-sec"><h3>Food & coffee</h3>${MEALS.map(([m, zh]) => {
    const list = stops.filter(s => mealOf(s) === m);
    return list.length ? `<section class="part meal"><h4><span>${m}</span><small lang="zh-Hans">${zh}</small></h4><ol class="plan">${list.map(x => stopHTML(x, true)).join("")}</ol></section>` : "";
  }).join("")}${ideasHTML(ideas)}</div>`;
}
const PART_ZH = { Morning: "上午", Midday: "中午", Afternoon: "下午", Evening: "晚上" };
const PART_TIME = { Morning: "until 11:00", Midday: "11:00 to 14:00", Afternoon: "14:00 to 17:00", Evening: "17:00 on" };
const splitZh = n => { const zh = cjk(n); return [zh ? n.replace(/[㐀-鿿·]+/g, "").replace(/\s+/g, " ").trim() : n, zh]; };
function exploreFor(d, part, stops) {
  if (d.explore && d.explore[part]) return d.explore[part];
  return stops.flatMap(s => (s.wander || []).map(([n, note, k]) => { const [en, zh] = splitZh(n); return { name: en, zh, about: note, amap: k }; }));
}
function exploreHTML(list) {
  if (!list.length) return "";
  const names = list.map(x => x.name);
  const preview = names.length > 2 ? `${names.slice(0, 2).join(", ")} and ${names.length - 2} more` : names.join(" and ");
  return `<details class="near"><summary><span><b>Explore nearby</b><small>${esc(preview)}</small></span><span class="plus" aria-hidden="true">+</span></summary>
    <ul>${list.map(x => `<li><div>${x.kind ? `<span class="kind">${esc(x.kind)}</span>` : ""}<b>${esc(x.name)}</b>${x.zh ? ` <span class="zh" lang="zh-Hans">${esc(x.zh)}</span>` : ""}${x.about ? `<p>${esc(x.about)}</p>` : ""}${(x.notes || []).length ? `<details class="about"><summary>About this place</summary><div class="ab">${x.notes.map(([k, n, t]) => `<div class="ab-item">${paras(t)}${srcLink(SRC[n])}</div>`).join("")}</div></details>` : ""}</div>${x.amap ? `<a class="btn sm" href="${amap(x.amap)}" target="_blank" rel="noopener">${pinIcon}Amap</a>` : ""}</li>`).join("")}</ul></details>`;
}
function itinHTML(d, stops) {
  const order = ["Morning", "Midday", "Afternoon", "Evening"];
  const groups = Object.fromEntries(order.map(p => [p, []])); let prev = null;
  stops.forEach(s => {
    let p = partOf(s.t, prev);
    if (prev && order.indexOf(p) < order.indexOf(prev)) p = prev;
    groups[p].push(s); prev = p;
  });
  // Restaurants go in the part of the day they suit; if we have nothing planned then, use the nearest part we do
  const busy = order.filter(p => groups[p].length || exploreFor(d, p, groups[p]).length);
  const home = p => busy.includes(p) ? p : (busy.filter(b => order.indexOf(b) < order.indexOf(p)).pop() || busy[0]);
  return order.map(p => {
    const list = groups[p], ex = exploreFor(d, p, list);
    const eats = (d.foodIdeas || []).filter(f => home(MEAL_PART[f.meal] || "Evening") === p);
    if (!list.length && !ex.length && !eats.length) return "";
    return `<section class="band">
      <h4><span class="b-name">${p}</span><span class="b-zh" lang="zh-Hans">${PART_ZH[p]}</span><span class="b-time">${PART_TIME[p]}</span></h4>
      ${list.length ? `<ol class="plan">${list.map(x => stopHTML(x)).join("")}</ol>` : ""}
      ${exploreHTML(ex)}
      ${eatHTML(eats, d)}
    </section>`;
  }).join("");
}
function remindHTML(stops) {
  if (!stops.length) return "";
  return `<div class="remind">${stops.map(s => `<div class="rm"><span class="rm-h">Don't forget${/^\d/.test(s.t) ? `, ${esc(s.t)}` : ""}</span><b>${esc(s.title)}</b>${s.detail ? `<span>${esc(s.detail)}</span>` : ""}${s.url ? `<a class="btn sm" href="${s.url}" target="_blank" rel="noopener">Open booking page</a>` : ""}</div>`).join("")}</div>`;
}
const MEAL_PART = { Breakfast: "Morning", Coffee: "Morning", Lunch: "Midday", Snack: "Afternoon", Dinner: "Evening" };
// Explore Food Choices: foods to try (comma list, tap to search Dianping), then places to get them.
// Anything already in the day's plan is left out.
function eatHTML(ideas, d) {
  if (!ideas || !ideas.length) return "";
  const planText = (d ? d.stops : []).map(s => [s.title, s.detail || "", ...(s.options || []).map(o => o[0]), ...(s.order || []).map(o => o[1])].join(" ")).join(" ");
  const planLow = planText.toLowerCase();
  const enOf = n => disp(n).replace(/\s*[㐀-鿿].*$/, "").trim();
  const placeInPlan = f => { const zh = firstZh(f.name), en = enOf(f.name).toLowerCase(); return (zh.length > 1 && planText.includes(zh)) || (en.length > 3 && planLow.includes(en)); };
  const dishInPlan = f => { const zh = firstZh(f.dish); return zh.length > 1 && planText.includes(zh); };
  const places = ideas.filter(f => !placeInPlan(f));
  const dishes = []; const seen = new Set();
  ideas.forEach(f => { if (!f.dish || seen.has(f.dish) || dishInPlan(f)) return; seen.add(f.dish); dishes.push(f); });
  if (!places.length && !dishes.length) return "";
  const kw = f => f.dianping || (/coffee/i.test(f.meal + " " + f.dish) ? "咖啡" : firstZh(f.dish) || foodKw(f.dish, f.name, f.what) || firstZh(f.name));
  const preview = [dishes.length ? dishes.slice(0, 3).map(f => enOf(f.dish)).join(", ") : "", places.length ? `${places.length} ${places.length === 1 ? "place" : "places"}` : ""].filter(Boolean).join(" · ");
  return `<details class="near eat"><summary><span><b>Explore Food Choices</b><small>${esc(preview)}</small></span><span class="plus" aria-hidden="true">+</span></summary>
    ${dishes.length ? `<div class="eat-sub">Foods to try</div><p class="eat-try">${dishes.map(f => `<a class="dp" href="${dpWeb(kw(f))}" data-dp="${esc(kw(f))}" target="_blank" rel="noopener">${esc(f.dish)}</a>${f.short ? ` <span>(${esc(f.short)})</span>` : ""}`).join(", ")}</p><p class="eat-hint">Tap one to look it up on Dianping.</p>` : ""}
    ${places.length ? `<div class="eat-sub">Where to get them</div><ul class="eat-list">${places.map(f => { const meta = [f.area, f.hours].filter(Boolean).join(" · ");
      return `<li><div class="eat-n"><b>${esc(f.name)}</b>${f.dish ? ` <span class="dish">${esc(enOf(f.dish) || f.dish)}</span>` : ""}</div>
      ${f.why ? `<p>${esc(f.why)}</p>` : ""}${f.tip ? `<p><b>Tip:</b> ${esc(f.tip)}</p>` : ""}
      <div class="eat-m">${meta ? `<span>${esc(meta)}</span>` : ""}${f.amap ? `<a class="tl" href="${amap(f.amap)}" target="_blank" rel="noopener">Amap</a>` : ""}</div></li>`; }).join("")}</ul>` : ""}
  </details>`;
}

// ----- Packing / shopping lists: each person adds their own items, saved on this phone -----
const LISTS_KEY = "trip-lists-v2";
// Older versions started every phone with two fixed names; clear those so each person types their own.
try { localStorage.removeItem("trip-lists-v1"); } catch (e) {}
function loadLists() { try { return JSON.parse(localStorage.getItem(LISTS_KEY) || "{}"); } catch (e) { return {}; } }
function saveLists(L) { try { localStorage.setItem(LISTS_KEY, JSON.stringify(L)); } catch (e) {} try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} }
function listFor(kind, person, starter) {
  const L = loadLists(); L[kind] = L[kind] || {};
  if (!L[kind][person]) { L[kind][person] = (starter || []).map(t => ({ t, done: false })); saveLists(L); }
  return L[kind][person];
}
function personListHTML(kind, person, starter) {
  const items = listFor(kind, person, starter);
  const left = items.filter(x => !x.done).length;

  document.addEventListener("visibilitychange", mark, { once: true });
  window.addEventListener("pagehide", mark, { once: true });
  window.addEventListener("blur", mark, { once: true });
  location.href = appUrl;
  setTimeout(() => { if (!left && document.visibilityState === "visible") window.open(web, "_blank", "noopener"); }, 1800);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.dp, a[href^='https://uri.amap.com/search']"); if (!a) return;
  if (!IOS && !ANDROID) return; // on a computer, just open the web page
  e.preventDefault();
  if (a.classList.contains("dp")) { openApp("dianping://searchshoplist?keyword=" + encodeURIComponent(a.dataset.dp), a.href); return; }
  const kw = new URL(a.href).searchParams.get("keyword") || "";
  const q = (kw.includes(CITIES[CITY].zh) ? "" : CITIES[CITY].zh + " ") + kw;
  const app = IOS
    ? `iosamap://poi?sourceApplication=ChinaTrip&name=${encodeURIComponent(q)}&dev=0`
    : `androidamap://poi?sourceApplication=ChinaTrip&keywords=${encodeURIComponent(q)}&dev=0`;
  openApp(app, a.href);
});
deck.addEventListener("click", e => {
  const b = e.target.closest("[data-expand]"); if (!b) return;
  const card = b.closest(".card"); const all = [...card.querySelectorAll("details.stop-d")];
  const openAll = all.some(d => !d.open);
  all.forEach(d => d.open = openAll);
  card.querySelectorAll("[data-expand]").forEach(x => x.textContent = openAll ? "Collapse all" : "Expand all");
});
// Packing / shopping list interactions
function rerenderList(box) {
  const S = CITIES[CITY].start, kind = box.dataset.kind;
  box.outerHTML = personListHTML(kind, box.dataset.person, kind === "packing" ? S.packingStarter : S.shoppingStarter);
}
function editList(box, fn) { const L = loadLists(); fn(L[box.dataset.kind][box.dataset.person]); saveLists(L); rerenderList(box); }
deck.addEventListener("click", e => {
  const b = e.target.closest("[data-goto]"); if (!b) return;
  const i = all.findIndex(d => d.key === b.dataset.goto);
  if (i >= 0) goTo(i);
});
deck.addEventListener("submit", e => {
  const nf = e.target.closest("form[data-newp]");
  if (nf) {
    e.preventDefault();
    const name = nf.querySelector("input").value.trim(); if (!name) return;
    const kind = nf.closest("[data-panel]").dataset.panel, S = CITIES[CITY].start;
    listFor(kind, name, kind === "packing" ? S.packingStarter : S.shoppingStarter);
    rerenderPanel(kind);
    const box = deck.querySelector(`.plist[data-kind="${kind}"][data-person="${CSS.escape(name)}"] form[data-add] input`); if (box) box.focus();
    return;
  }
  const rf = e.target.closest("form[data-renamef]");
  if (rf) {
    e.preventDefault();
    const box = rf.closest(".plist"), kind = box.dataset.kind, old = box.dataset.person;
    const name = rf.querySelector("input").value.trim();
    if (name && name !== old) {
      const L = loadLists(), cur = L[kind] || {};
      if (!cur[name]) { const next = {}; Object.keys(cur).forEach(k => { next[k === old ? name : k] = cur[k]; }); L[kind] = next; saveLists(L); }
    }
    rerenderPanel(kind); return;
  }
  const f = e.target.closest("form[data-add]"); if (!f) return;
  e.preventDefault();
  const box = f.closest(".plist"); const lines = f.querySelector("input").value.split(/\n|;/).map(x => x.replace(/^[-•*\s]+/, "").trim()).filter(Boolean);
  if (!lines.length) return;
  editList(box, arr => lines.forEach(t => arr.push({ t, done: false })));
  const again = deck.querySelector(`.plist[data-kind="${box.dataset.kind}"][data-person="${box.dataset.person}"] input[type=text]`); if (again) again.focus();
});
deck.addEventListener("paste", e => {
  const inp = e.target.closest(".plist form[data-add] input"); if (!inp) return;
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if (!/\n/.test(text)) return;
  e.preventDefault(); inp.value = text; inp.form.requestSubmit();
});
deck.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) { const box = del.closest(".plist"); editList(box, arr => arr.splice(+del.dataset.del, 1)); return; }
  const rn = e.target.closest("[data-rename]");
  if (rn) {
    const box = rn.closest(".plist"), h = box.querySelector(".plist-h");
    h.outerHTML = `<form class="plist-rename" data-renamef><input type="text" value="${esc(box.dataset.person)}" aria-label="Name" maxlength="40" enterkeyhint="done"><button type="submit">Save</button><button type="button" class="mini" data-cancel>Cancel</button><button type="button" class="mini warn" data-droplist>Delete list</button></form>`;
    const inp = box.querySelector(".plist-rename input"); inp.focus(); inp.select(); return;
  }
  if (e.target.closest("[data-cancel]")) { rerenderPanel(e.target.closest(".plist").dataset.kind); return; }
  const dr = e.target.closest("[data-droplist]");
  if (dr) {
    if (!dr.dataset.sure) { dr.dataset.sure = "1"; dr.textContent = "Tap again to delete"; return; }
    const box = dr.closest(".plist"), kind = box.dataset.kind, L = loadLists();
    if (L[kind]) delete L[kind][box.dataset.person]; saveLists(L); rerenderPanel(kind); return;
  }
});
deck.addEventListener("change", e => {
  const li = e.target.closest("input[data-li]");
  if (li) { const box = li.closest(".plist"); editList(box, arr => { arr[+li.dataset.li].done = li.checked; }); return; }
}, true);
deck.addEventListener("change", e => {
  const c = e.target.closest("input[data-k]"); if (!c) return;
  c.closest("li").classList.toggle("done", c.checked);
  try {
    const done = JSON.parse(localStorage.getItem(CITY + "-bookings") || "{}");
    done[c.dataset.k] = c.checked;
    localStorage.setItem(CITY + "-bookings", JSON.stringify(done));
  } catch (err) {}
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") goTo(current + 1);
  if (e.key === "ArrowLeft") goTo(current - 1);
});

// Theme toggle
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const labelTheme = () => { themeBtn.textContent = isDark() ? "Day" : "Night"; themeBtn.setAttribute("aria-label", isDark() ? "Switch to day mode" : "Switch to night mode"); };
try { const t = localStorage.getItem("sh-theme"); if (t) root.dataset.theme = t; } catch (e) {}
labelTheme();
themeBtn.addEventListener("click", () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  labelTheme();
  try { localStorage.setItem("sh-theme", root.dataset.theme); } catch (e) {}
});

// Initial card: hash (#bj-d2, or old-style #d2 = Shanghai) > today > Shanghai prep
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
(() => {
  const m = location.hash.match(/^#(?:(sh|bj)-)?(start|about|hoods|list|d\d)$/);
  let city = "sh", key = null;
  if (m) { city = m[1] || "sh"; key = m[2]; }
  else if (todayCity) { city = todayCity; key = todayKey; }
  render(city, Math.max(0, cardsFor(CITIES[city]).findIndex(c => c.d.key === key)));
})();

// Offline copy (see sw.js): register once the page has loaded
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      // Warm the offline copy with the city photos too (they're blocked in China without a VPN)
      const photos = Object.values(CITIES).flatMap(c => [c.info.photo, ...c.info.areas.map(a => a.photo), ...(c.hoods ? [c.hoods.mapImage, ...c.hoods.areas.map(a => a.photo)] : [])]).filter(Boolean).map(CF).concat(Object.values(CITIES).map(c => c.hoods && c.hoods.mapUrl).filter(Boolean));
      [...new Set(photos)].forEach(u => fetch(u, { mode: "no-cors" }).catch(() => {}));
    }).catch(() => {});
  });
}
</script>
