      --bg: #16130f; --card: #211d18; --ink: #f2ebe0; --muted: #a99d8e; --line: #3a332b;
      --accent: #e0675c; --accent-soft: #3d2420; --gold: #d3a65a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
      --t-run: #7cc5ad; --t-run-bg: #1e3530;
      --t-coffee: #d9a878; --t-coffee-bg: #3a2c20;
      --t-food: #ef8a7f; --t-food-bg: #3d2420;
      --t-tea: #b3cf7b; --t-tea-bg: #2b331d;
      --t-see: #8fb3e3; --t-see-bg: #1f2b3b;

    --bg: #16130f; --card: #211d18; --ink: #f2ebe0; --muted: #a99d8e; --line: #3a332b;

    --t-tea: #b3cf7b; --t-tea-bg: #2b331d;
    --t-see: #8fb3e3; --t-see-bg: #1f2b3b;

    --t-misc: #b5aa9b; --t-misc-bg: #2d2822;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 Inter, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  header.top {

  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

  .brand h1 span { color: var(--accent); }
  .brand small { color: var(--muted); font-size: 12px; }
  .tabs {
    display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: 500 13px/1 Inter, sans-serif; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 52px;
  }
  .tab b { font: 700 15px/1 Fraunces, serif; }
  .tab small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tab.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tab.active small { color: color-mix(in srgb, var(--bg) 70%, transparent); }
  .tab.today::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .deck {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; padding: 18px 0 40px;
  }
  .deck::-webkit-scrollbar { display: none; }
  .slot {
    flex: 0 0 100%; scroll-snap-align: center; padding: 0 16px;
    display: flex; justify-content: center;
  }
  .card {
    width: 100%; max-width: 560px; background: var(--card); border-radius: 22px;
    box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden;
    transition: transform .35s ease, opacity .35s ease;
    position: relative;
  }
  .slot.away .card { transform: scale(.94) translateY(10px); opacity: .55; }
  .card::before, .card::after {
    content: ""; position: absolute; left: 14px; right: 14px; height: 8px; bottom: -8px;
    background: var(--card); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; z-index: -1;
  }
  .hero {
    padding: 20px 20px 16px;
    background:

      var(--card);
    border-bottom: 1px dashed var(--line);
  }
  .eyebrow { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .eyebrow .num { color: var(--accent); }
  .hero h2 { font: 700 26px/1.15 Fraunces, Georgia, serif; margin: 8px 0 10px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .highlights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: var(--t-misc-bg); color: var(--t-misc); }

  .section { padding: 14px 16px 6px; }
  .section h3 { font: 600 12px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 4px 12px; }

  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 52px; top: 6px; bottom: 6px; width: 2px; background: var(--line); border-radius: 2px; }
  .stop { display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding: 4px 0 14px; position: relative; }
  .stop .time { font: 600 12px/1.25 Inter, sans-serif; color: var(--muted); text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .stop .dot { position: absolute; left: 48px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--muted); }
  .stop .body { min-width: 0; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-bottom: 4px; }
  .stop .title { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .stop .detail { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .stop .addr { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: 600 12.5px/1 Inter, sans-serif; padding: 8px 11px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:active { transform: scale(.97); }

  .t-run .tag { background: var(--t-run-bg); color: var(--t-run); } .t-run .dot { border-color: var(--t-run); }
  .t-coffee .tag { background: var(--t-coffee-bg); color: var(--t-coffee); } .t-coffee .dot { border-color: var(--t-coffee); background: var(--t-coffee); }
  .t-food .tag { background: var(--t-food-bg); color: var(--t-food); } .t-food .dot { border-color: var(--t-food); background: var(--t-food); }
  .t-tea .tag { background: var(--t-tea-bg); color: var(--t-tea); } .t-tea .dot { border-color: var(--t-tea); }
  .t-see .tag { background: var(--t-see-bg); color: var(--t-see); } .t-see .dot { border-color: var(--t-see); }
  .t-shop .tag { background: var(--t-shop-bg); color: var(--t-shop); } .t-shop .dot { border-color: var(--t-shop); }
  .t-misc .tag { background: var(--t-misc-bg); color: var(--t-misc); }
  .t-book .tag { background: var(--accent); color: #fff; } .t-book .dot { border-color: var(--accent); background: var(--accent); }

  details { border-top: 1px solid var(--line); }
  details summary {
    list-style: none; cursor: pointer; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;

  details summary::-webkit-details-marker { display: none; }
  details summary .chev { transition: transform .2s; color: var(--muted); }

  details summary .count { color: var(--muted); font-weight: 500; font-size: 12.5px; margin-left: 6px; }
  .notes { padding: 0 20px 16px; }
  .note { padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .note:last-child { border-bottom: 0; }
  .note b { display: block; font-size: 14px; margin-bottom: 2px; }
  .note span { color: var(--muted); font-size: 13.5px; }
  .intro-note { color: var(--muted); font-size: 13.5px; padding: 0 0 6px; font-style: italic; }

  .card-foot { display: flex; justify-content: space-between; padding: 14px 16px 18px; border-top: 1px solid var(--line); }
  .nav-btn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 10px 14px; font: 600 13px/1 Inter, sans-serif; cursor: pointer; }
  .nav-btn[disabled] { opacity: .35; }

  .checklist { list-style: none; padding: 0; margin: 0; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px dashed var(--line); }
  .checklist li:last-child { border-bottom: 0; }
  .checklist input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 1px; flex: 0 0 auto; }
  .checklist .when { font-weight: 700; font-size: 13px; color: var(--accent); display: block; }
  .checklist label { font-size: 14px; }
  .checklist li.done label { text-decoration: line-through; color: var(--muted); }
  .tips { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .tips li { margin: 6px 0; }
  .about { margin-top: 8px; border: 0; }
  .about summary { padding: 0; font-size: 12.5px; font-weight: 600; color: var(--gold); display: inline-flex; gap: 4px; justify-content: flex-start; }
  .about[open] summary { margin-bottom: 6px; }
  .about .ab { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--ink); }
  .about .ab p { margin: 0 0 8px; } .about .ab p:last-child { margin: 0; }
  .about .ab b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 1px; }
  .alts { padding: 4px 16px 10px; }
  .alt-group { margin: 6px 0 14px; }
  .alt-group h4 { margin: 0 4px 8px; font: 700 12px/1 Inter, sans-serif; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
  .alt { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; margin-bottom: 8px; }
  .alt .n { font-weight: 600; font-size: 14.5px; }
  .alt .w { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .alt .a { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .alt .actions { margin-top: 8px; }
  .alt .btn { background: var(--card); }
  .theme-toggle { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 999px; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; }
</style>
</head>

const pinIcon ='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const chev = '<span class="chev">›</span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function notesBlock(title, list, intro) {
  if (!list || !list.length) return "";
  return `<details><summary><span>${title}<span class="count">${list.length}</span></span>${chev}</summary>
    <div class="notes">${intro ? `<div class="intro-note">${esc(intro)}</div>` : ""}
    ${list.map(([n, t]) => `<div class="note"><b>${esc(n)}</b><span>${esc(t)}</span></div>`).join("")}</div></details>`;
}

// Attach each place, sight and dish note to the stop it belongs to
const plain = n => n.replace(/[㐀-鿿（）"“”()]/g, " ").replace(/\s+/g, " ").trim();
const cjk = n => (n.match(/[㐀-鿿]+/g) || []).join("");
const enName = n => n.split(/[㐀-鿿"“(（]/)[0].split(" & ")[0].trim().toLowerCase();
const disp = n => n.replace(/\s*\(.*\)$/, "").trim();
const NOTE_INDEX = {};
DAYS.forEach(d => {
  (d.sights || []).forEach(n => NOTE_INDEX[n[0]] = ["History", ...n]);
  (d.places || []).forEach(n => NOTE_INDEX[n[0]] = ["Known for", ...n]);
  (d.shopping || []).forEach(n => NOTE_INDEX[n[0]] = ["Shop", ...n]);
  (d.food.items || []).forEach(n => NOTE_INDEX[n[0]] = ["The dish", ...n]);
});
// Hand-linked notes for stops whose titles don't name the place
const KNOW = {
  d2: { 2: ["Shanghai street breakfast"] },
  d3: { 2: ["Shanghai street breakfast"] },
  d4: { 4: ['Salomon "Fu Jun"', "Musinsa Store", "Deja Vu Recycle", "Harmay 话梅", "Wukang Building", "Former French Concession"] },
  d5: { 9: ["Yongkang Road"] },
  d6: { 0: ["The Bund", "Waibaidu Bridge"] }
};
Object.entries(KNOW).forEach(([dk, m]) => {
  const d = DAYS.find(x => x.key === dk);
  Object.entries(m).forEach(([i, names]) => { d.stops[+i].know = names; });
});
DAYS.forEach(d => {
  const notes = [
    ...(d.sights || []).map(n => ["History", ...n]),
    ...(d.places || []).map(n => ["Known for", ...n]),
    ...(d.food.items || []).map(n => ["The dish", ...n])
  ];
  d.stops.forEach(s => {
    const hay = (s.title + " " + (s.detail || "")).toLowerCase();
    s.about = notes.filter(([kind, name]) => {
      const en = enName(name);
      const zh = cjk(name);
      if (kind === "The dish") return zh && hay.includes(zh);
      return (en.length >= 3 && s.title.toLowerCase().includes(en)) || (zh.length > 1 && s.title.includes(zh));
    });
    (s.know || []).forEach(k => { const hit = NOTE_INDEX[k]; if (hit && !s.about.includes(hit)) s.about.push(hit); });
  });
});

function aboutHTML(s) {
  if (!s.about || !s.about.length) return "";
  return `<details class="about"><summary>ⓘ About this place</summary><div class="ab">
    ${s.about.map(([kind, n, t]) => `<p><b>${esc(kind)} · ${esc(disp(n))}</b>${esc(t)}</p>`).join("")}</div></details>`;
}

function altsHTML(key) {
  const list = ALTS[key]; if (!list) return "";
  const groups = {};
  list.forEach(a => (groups[a[0]] = groups[a[0]] || []).push(a));
  return `<details><summary><span>Off-plan options<span class="count">${list.length}</span></span>${chev}</summary><div class="alts">
    ${Object.entries(groups).map(([g, items]) => `<div class="alt-group"><h4>${esc(g)}</h4>
      ${items.map(([, n, w, a, k]) => `<div class="alt"><div class="n">${esc(n)}</div><div class="w">${esc(w)}</div>
        ${a ? `<div class="a">${esc(a)}</div>` : ""}
        ${k ? `<div class="actions"><a class="btn" href="${amap(k)}" target="_blank" rel="noopener">${pinIcon}Open in Amap</a></div>` : ""}</div>`).join("")}
    </div>`).join("")}</div></details>`;
}

function stopHTML(s) {
  const links = s.links
    ? s.links.map(([lbl, k]) => `<a class="btn" href="${amap(k)}" target="_blank" rel="noopener">${pinIcon}${esc(lbl)}</a>`).join("")
    : s.map ? `<a class="btn" href="${amap(s.map)}" target="_blank" rel="noopener">${pinIcon}Open in Amap</a>` : "";
  return `<li class="stop t-${s.type}">
    <div class="time">${esc(s.t)}</div><span class="dot"></span>
    <div class="body">
      <span class="tag">${esc(s.label)}</span>
      <div class="title">${esc(s.title)}</div>
      ${s.detail ? `<div class="detail">${esc(s.detail)}</div>` : ""}
      ${s.addr ? `<div class="addr">${esc(s.addr)}</div>` : ""}
      ${links ? `<div class="actions">${links}</div>` : ""}
      ${aboutHTML(s)}
    </div></li>`;
}

function dayCard(d, i, total) {
  return `<article class="card">
    <div class="hero">
      <div class="eyebrow"><span>${esc(d.eyebrow)}</span><span class="num">${i}/${total}</span></div>
      <h2>${esc(d.title)}</h2>
      <p>${esc(d.summary)}</p>
      <div class="highlights">${d.highlights.map(h => `<span class="pill">${esc(h)}</span>`).join("")}</div>
    </div>
    <div class="section"><h3>The day</h3><ol class="timeline">${d.stops.map(stopHTML).join("")}</ol></div>
    ${altsHTML(d.key)}
    ${notesBlock("Today's food, explained", d.food.items, d.food.intro)}
    ${notesBlock("Where you're eating & drinking", d.places)}
    ${notesBlock("Where you're shopping", d.shopping)}
    ${notesBlock("Today's sights, explained", d.sights)}
    <div class="card-foot">
      <button class="nav-btn" data-go="-1">‹ Prev</button>
      <button class="nav-btn" data-go="1" ${i === total ? "disabled" : ""}>Next ›</button>
    </div>
  </article>`;
}

function startCard() {
  let done = {};
  try { done = JSON.parse(localStorage.getItem("sh-checks") || "{}"); } catch (e) {}
  return `<article class="card">
    <div class="hero">
      <div class="eyebrow"><span>${START.eyebrow}</span><span class="num">Nov 2026</span></div>
      <h2>${START.title}</h2>
      <p>${esc(START.summary)}</p>
    </div>
    <div class="section"><h3>Booking checklist</h3>
      <ul class="checklist">${START.checklist.map(([w, t], k) => `
        <li class="${done[k] ? "done" : ""}"><input type="checkbox" id="c${k}" data-k="${k}" ${done[k] ? "checked" : ""}>
        <label for="c${k}"><span class="when">${esc(w)}</span>${esc(t)}</label></li>`).join("")}
      </ul>
    </div>
    <div class="section"><h3>Good to know</h3><ul class="tips">${START.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="card-foot">
      <button class="nav-btn" disabled>‹ Prev</button>
      <button class="nav-btn" data-go="1">Day 1 ›</button>
    </div>
  </article>`;
}

const all = [START, ...DAYS];
const deck = document.getElementById("deck");
const tabs = document.getElementById("tabs");

deck.innerHTML = all.map((d, i) =>
  `<section class="slot" id="card-${d.key}" data-i="${i}">${i === 0 ? startCard() : dayCard(d, i, DAYS.length)}</section>`
).join("");

// Today in Shanghai
let todayKey = null;
try {
  const sh = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const hit = DAYS.find(d => d.date === sh);
  if (hit) todayKey = hit.key;
} catch (e) {}

tabs.innerHTML = all.map((d, i) =>
  `<button class="tab ${d.key === todayKey ? "today" : ""}" data-i="${i}" aria-label="${esc(d.eyebrow)}"><small>${d.tabSub}</small><b>${d.tabTop}</b></button>`
).join("");

const slots = [...deck.querySelectorAll(".slot")];
const tabBtns = [...tabs.querySelectorAll(".tab")];
let current = 0;

function goTo(i, smooth = true) {
  i = Math.max(0, Math.min(all.length - 1, i));
  deck.scrollTo({ left: slots[i].offsetLeft, behavior: smooth ? "smooth" : "auto" });
}
function setActive(i) {
  current = i;
  slots.forEach((s, k) => s.classList.toggle("away", k !== i));
  tabBtns.forEach((b, k) => b.classList.toggle("active", k === i));
  const tb = tabBtns[i];
  tabs.scrollTo({ left: tb.offsetLeft - (tabs.clientWidth - tb.offsetWidth) / 2, behavior: "smooth" });
  try { history.replaceState(null, "", "#" + all[i].key); } catch (e) {}
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting && e.intersectionRatio > 0.6) setActive(+e.target.dataset.i); });
}, { root: deck, threshold: [0.6] });
slots.forEach(s => io.observe(s));

tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  goTo(+b.dataset.i); window.scrollTo({ top: 0, behavior: "smooth" });
});
deck.addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b || b.disabled) return;
  goTo(current + (+b.dataset.go)); window.scrollTo({ top: 0, behavior: "smooth" });
});
deck.addEventListener("change", e => {
  const c = e.target.closest("input[data-k]"); if (!c) return;
  c.closest("li").classList.toggle("done", c.checked);
  try {
    const done = JSON.parse(localStorage.getItem("sh-checks") || "{}");
    done[c.dataset.k] = c.checked;
    localStorage.setItem("sh-checks", JSON.stringify(done));
  } catch (err) {}
});
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") goTo(current + 1);
  if (e.key === "ArrowLeft") goTo(current - 1);
});

// Theme toggle
const root = document.documentElement;
try { const t = localStorage.getItem("sh-theme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("sh-theme", root.dataset.theme); } catch (e) {}
});

// Initial card: hash > today > prep card
const fromHash = all.findIndex(d => "#" + d.key === location.hash);
const startIdx = fromHash >= 0 ? fromHash : todayKey ? all.findIndex(d => d.key === todayKey) : 0;
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
requestAnimationFrame(() => { goTo(startIdx, false); setActive(startIdx); window.scrollTo(0, 0); });
</script>
</body>
</html>
