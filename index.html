<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1622" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shanghai">
<title>China 2026 Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6e9ec; --card: #ffffff; --ink: #14202e; --muted: #5b6673; --line: #d3d8de; --rail-bg: #f1f3f5;
    --shadow: 0 2px 0 rgba(20,32,46,.06), 0 18px 40px -18px rgba(20,32,46,.35);
    --c: #6b7785; --ct: #4a5563;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0c1622; --card: #15212f; --ink: #e8edf2; --muted: #93a0ae; --line: #26364a; --rail-bg: #1b2938; --shadow: 0 18px 40px -18px rgba(0,0,0,.8); }
  }
  :root[data-theme="dark"] { --bg: #0c1622; --card: #15212f; --ink: #e8edf2; --muted: #93a0ae; --line: #26364a; --rail-bg: #1b2938; --shadow: 0 18px 40px -18px rgba(0,0,0,.8); }
  .card { --at: var(--ct); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { --at: color-mix(in srgb, var(--c) 55%, #fff); } }
  :root[data-theme="dark"] .card { --at: color-mix(in srgb, var(--c) 55%, #fff); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15.5px/1.5 Archivo, "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .zh { font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--c); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

  /* Top bar: line roundels */
  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--card);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand h1 { margin: 0; font: 800 18px/1 Archivo, sans-serif; font-stretch: 75%; display: flex; align-items: baseline; gap: 7px; }
  .brand h1 .zh { font-weight: 900; font-size: 18px; }
  .brand h1 small { font-weight: 500; color: var(--muted); font-size: 14px; font-stretch: 100%; }
  .tabs { display: flex; gap: 12px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; padding: 8px 6px 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 5px; font: 500 12px/1 Archivo, sans-serif;
  }
  .tab .roundel {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--tc); color: #fff; font: 800 19px/1 Archivo, sans-serif; font-stretch: 80%;
    box-shadow: 0 0 0 3px var(--card); transition: box-shadow .2s, transform .2s;
  }
  .tab.active .roundel { box-shadow: 0 0 0 3px var(--card), 0 0 0 5.5px var(--tc); transform: scale(1.05); }
  .tab small { color: var(--muted); }
  .tab.active small { color: var(--ink); font-weight: 700; }
  .tab.today small { color: var(--tc); font-weight: 800; }

  /* Deck */
  .deck { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 18px 0 48px; }
  .deck::-webkit-scrollbar { display: none; }
  .slot { flex: 0 0 100%; scroll-snap-align: center; padding: 0 14px; display: flex; justify-content: center; }
  .card {
    width: 100%; max-width: 560px; background: var(--card); border-radius: 18px; overflow: hidden;
    box-shadow: var(--shadow); transition: transform .35s ease, opacity .35s ease;
  }
  .slot.away .card { transform: scale(.95); opacity: .5; }

  /* Hero: the station sign */
  .hero { background: var(--c); color: #fff; padding: 18px 20px 0; overflow: hidden; }
  .sign-top { display: flex; justify-content: space-between; align-items: center; font: 600 14px/1 Archivo, sans-serif; }
  .sign-top .badge { display: inline-flex; align-items: center; gap: 9px; }
  .sign-top .badge b { width: 30px; height: 30px; border-radius: 50%; background: #fff; color: var(--ct); display: grid; place-items: center; font: 800 16px/1 Archivo, sans-serif; font-stretch: 80%; }
  .hero .zh-big { font: 900 clamp(78px, 26vw, 136px)/.9 "Noto Sans SC", sans-serif; letter-spacing: -.03em; margin: 20px 0 0 -5px; white-space: nowrap; }
  .hero .area { font: 800 27px/1.05 Archivo, sans-serif; font-stretch: 68%; margin: 12px 0 18px; }
  .platform { background: var(--card); color: var(--ink); margin: 0 -20px; padding: 18px 20px; border-top: 7px solid var(--ink); }
  .platform h2 { font: 800 25px/1.12 Archivo, sans-serif; font-stretch: 85%; margin: 0 0 8px; }
  .platform p { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
  .highlights { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .pill { font: 600 13px/1 Archivo, sans-serif; padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--c); color: var(--at); }

  /* The line diagram */
  .section { padding: 2px 18px 4px; }
  .section h3 { font: 800 17px/1 Archivo, sans-serif; font-stretch: 80%; margin: 14px 0 18px; }
  .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
  .timeline::before { content: ""; position: absolute; left: 63px; top: 10px; bottom: 22px; width: 6px; background: var(--c); border-radius: 3px; }
  .stop { display: grid; grid-template-columns: 48px 1fr; gap: 38px; padding: 0 0 22px; position: relative; }
  .stop .time { font: 800 14.5px/1.2 Archivo, sans-serif; font-stretch: 78%; text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .stop .dot { position: absolute; left: 57px; top: 1px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 4px solid var(--c); }
  .stop.major .dot { width: 26px; height: 26px; left: 53px; top: -3px; border-width: 5px; box-shadow: 0 0 0 3px var(--card); }
  .stop.t-book .dot { background: var(--ink); border-color: var(--ink); }
  .stop .body { min-width: 0; }
  .tag { display: block; font: 600 13px/1 Archivo, sans-serif; color: var(--at); margin-bottom: 5px; }
  .t-book .tag { color: var(--ink); font-weight: 800; }
  .stop .title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .stop.major .title { font: 800 19px/1.2 Archivo, sans-serif; font-stretch: 85%; }
  .stop .detail { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .stop .addr { font-size: 13px; color: var(--muted); margin-top: 7px; padding-left: 10px; border-left: 2px solid var(--line); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font: 700 13px/1 Archivo, sans-serif; padding: 8px 12px 8px 10px; border-radius: 999px;
    background: var(--ink); color: var(--card);
  }
  .btn svg { width: 14px; height: 14px; }
  .btn:active { transform: scale(.97); }

  /* About this place */
  .about { margin-top: 10px; }
  .about summary { list-style: none; cursor: pointer; font: 700 13.5px/1 Archivo, sans-serif; color: var(--at); display: inline-flex; align-items: center; gap: 7px; }
  .about summary::-webkit-details-marker { display: none; }
  .about summary::before { content: "i"; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; font: italic 700 11px/1 Georgia, serif; }
  .about[open] summary { margin-bottom: 8px; }
  .about .ab { background: var(--rail-bg); border-left: 4px solid var(--c); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; }
  .about .ab p { margin: 0 0 7px; line-height: 1.55; }
  .about .ab .ab-item { padding: 0 0 12px; margin: 0 0 12px; border-bottom: 1px solid var(--line); }
  .about .ab .ab-item:last-child { padding: 0; margin: 0; border: 0; }
  .about .ab .ab-item p:last-child { margin: 0; }
  .about .ab b { display: block; font-size: 14px; color: var(--at); font-weight: 800; margin-bottom: 4px; }

  /* Folding panels */
  .panel { border-top: 1px solid var(--line); }
  .panel > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary .ttl { font: 800 18px/1.1 Archivo, sans-serif; font-stretch: 80%; }
  .panel > summary .sub { display: block; font: 400 13.5px/1.35 Archivo, sans-serif; color: var(--muted); margin-top: 3px; }
  .panel > summary .plus { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 17px; transition: transform .2s; }
  .panel[open] > summary .plus { transform: rotate(45deg); }
  .notes { padding: 0 18px 16px; }
  .note { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .note:last-child { border-bottom: 0; }
  .note b { display: block; font-size: 15px; margin-bottom: 2px; }
  .note span { color: var(--muted); font-size: 14px; display: block; }
  .note span p { margin: 0 0 6px; } .note span p:last-child { margin: 0; }
  .intro-note { font-size: 14px; padding: 0 0 6px; }

  /* Other options */
  .alts { padding: 0 18px 12px; }
  .alt-group { margin: 2px 0 16px; }
  .alt-group h4 { margin: 0 0 9px; font: 700 14.5px/1.2 Archivo, sans-serif; display: flex; align-items: center; gap: 9px; }
  .alt-group h4::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--c); background: var(--card); }
  .alt { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 8px; }
  .alt .n { font-weight: 700; font-size: 15px; }
  .alt .w { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .alt .a { color: var(--muted); font-size: 13px; margin-top: 5px; }

  .card-foot { display: flex; justify-content: space-between; padding: 14px 18px 20px; border-top: 1px solid var(--line); }
  .nav-btn { background: none; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 999px; padding: 10px 16px; font: 700 14px/1 Archivo, sans-serif; cursor: pointer; }
  .nav-btn[disabled] { opacity: .25; }

  .checklist { list-style: none; padding: 0; margin: 0; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .checklist li:last-child { border-bottom: 0; }
  .checklist input { width: 22px; height: 22px; accent-color: var(--ink); margin: 0; flex: 0 0 auto; }
  .checklist .when { font: 800 15px/1 Archivo, sans-serif; font-stretch: 78%; display: block; margin-bottom: 4px; }
  .checklist label { font-size: 14.5px; }
  .checklist li.done label { text-decoration: line-through; color: var(--muted); }
  .tips { margin: 0 0 10px; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
  .tips li { margin: 7px 0; }
  .theme-toggle { background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px; padding: 7px 11px; cursor: pointer; font: 600 12.5px/1 Archivo, sans-serif; }

  .brand h1, .city-switch button { white-space: nowrap; }
  @media (max-width: 440px) { .brand h1 small { display: none; } }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .city-switch { display: flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .city-switch button { background: none; border: 0; color: var(--ink); padding: 6px 11px; cursor: pointer; font: 900 14px/1 "Noto Sans SC", sans-serif; }
  .city-switch button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .stop.t-tbd .title { color: var(--muted); letter-spacing: .04em; font-weight: 800; }
  .stop.t-tbd .dot { border-style: dashed; }
  .src { display: inline-block; margin-top: 4px; font: 600 12px/1.3 Archivo, sans-serif; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
  .btn.dp { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn.dp span { font-family: "Noto Sans SC", sans-serif; font-weight: 900; }
  .ab-item + .ab-item { margin-top: 12px; }
  .history p { margin: 0 0 10px; font-size: 14.5px; max-width: 62ch; }
  figure { margin: 0 0 12px; }
  figure img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--rail-bg); }
  figcaption a { font-size: 11.5px; color: var(--muted); }
  .areas { display: grid; gap: 14px; }
  .area-card { border: 1.5px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; overflow: hidden; }
  .area-card figure { margin: 0; } .area-card figure img { border-radius: 0; aspect-ratio: 2/1; }
  .area-card figcaption { padding: 4px 14px 0; }
  .area-body { padding: 10px 14px 12px; }
  .area-body h4 { margin: 0 0 4px; font: 800 18px/1.15 Archivo, sans-serif; font-stretch: 82%; }
  .area-body h4 .zh { font-weight: 900; color: var(--muted); margin-left: 4px; }
  .area-body p { margin: 0; font-size: 14px; color: var(--muted); }
  .fine { font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
  .idea-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .idea-chips span { font-size: 13px; padding: 5px 9px; border-radius: 999px; background: var(--rail-bg); }


  .opts { margin-top: 10px; }
  .opts-h { font: 700 13px/1 Archivo, sans-serif; color: var(--ct); margin-bottom: 7px; }
  .opt { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; }
  .opt .n { font-weight: 700; font-size: 15px; }
  .opt .w { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .opt .a { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .opt .actions { margin-top: 8px; }
  .opt .btn.sm { padding: 6px 10px 6px 8px; font-size: 12.5px; }
  .order { margin-top: 10px; background: var(--rail-bg); border-radius: 12px; padding: 10px 12px 6px; }
  .order ul { list-style: none; margin: 0; padding: 0; }
  .order li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .order li:first-child { border-top: 0; }
  .order li b { font: 900 15px/1.3 "Noto Sans SC", sans-serif; white-space: nowrap; }
  .li-list { padding: 0 18px 12px; }
  .li-item { padding: 11px 0; border-bottom: 1px solid var(--line); }
  .li-item:last-child { border-bottom: 0; }
  .li-item .n { font-weight: 700; font-size: 15px; }
  .li-item .n .zh { font-weight: 900; color: var(--ct); margin-left: 2px; }
  .li-item .w { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .li-item .a { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .li-item .actions { margin-top: 7px; }
  .btn.sm { padding: 6px 10px 6px 8px; font-size: 12.5px; }
  .part { margin: 4px 0 18px; }
  .part h4 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px; padding: 7px 12px; border-radius: 10px; background: var(--rail-bg); border-left: 6px solid var(--c); font: 800 17px/1 Archivo, sans-serif; font-stretch: 85%; }
  .part h4 small { font: 900 13px/1 "Noto Sans SC", sans-serif; color: var(--muted); }
  .plan { list-style: none; margin: 0; padding: 0; }
  .plan .stop { display: block; padding: 14px 2px 14px 14px; border-bottom: 1px solid var(--line); }
  .plan .stop:last-child { border-bottom: 0; }
  .plan .stop .dot, .plan .stop .time { display: none; }
  .plan .stop .tag { display: flex; gap: 8px; align-items: baseline; }
  .plan .stop .hint { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .plan .stop.t-book .tag { color: var(--ink); }
  .wander { margin-top: 10px; border-left: 3px solid var(--c); padding-left: 12px; }
  .wd { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .wd:first-of-type { border-top: 0; }
  .wd b { display: block; font-size: 14.5px; }
  .wd span { display: block; color: var(--muted); font-size: 13px; }
  .wd .btn { flex: 0 0 auto; }
  .food-sec { border-top: 1px solid var(--line); margin-top: 6px; }
  .part.meal h4 { background: none; border: 1.5px solid var(--line); border-left: 6px solid var(--c); }
  .sec-h { display: flex; justify-content: space-between; align-items: center; }
  .expand { background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 700 12.5px/1 Archivo, sans-serif; cursor: pointer; }
  .stop-d > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .stop-d > summary::-webkit-details-marker { display: none; }
  .stop-d > summary .body { flex: 1; }
  .stop-d > summary .chev { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; transition: transform .2s; }
  .stop-d > summary .chev::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-2px) rotate(45deg); }
  .stop-d[open] > summary .chev { transform: rotate(180deg); }
  .stop-d .more { padding-top: 2px; }
  .metro { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink); margin-top: 8px; }
  .metro .m { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 11px/1 Archivo, sans-serif; margin-top: 1px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .brand { gap: 10px; }
  .city-switch { flex: 1; min-width: 0; display: flex; border: 2px solid var(--ink); border-radius: 14px; overflow: hidden; }
  .city-switch button { -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; min-height: 44px; margin: 0; border: 0; border-radius: 0;
    background: var(--card); color: var(--ink); -webkit-text-fill-color: currentColor; padding: 6px 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; font: 700 15px/1.1 Archivo, sans-serif; -webkit-tap-highlight-color: transparent; }
  .city-switch button + button { border-left: 2px solid var(--ink); }
  .city-switch button .zh { font: 900 16px/1 "Noto Sans SC", "PingFang SC", sans-serif; }
  .city-switch button small { flex-basis: 100%; text-align: center; font: 500 11px/1 Archivo, sans-serif; opacity: .75; }
  .city-switch button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  .theme-toggle { -webkit-appearance: none; appearance: none; flex: 0 0 auto; min-height: 44px; border-radius: 14px; -webkit-text-fill-color: currentColor; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="cityTitle" class="sr-only">Shanghai</h1>
    <div class="city-switch" role="group" aria-label="City">
      <button type="button" data-city="sh" aria-pressed="true"><span class="zh">上海</span><span class="en">Shanghai</span><small>Nov 15–20</small></button>
      <button type="button" data-city="bj" aria-pressed="false"><span class="zh">北京</span><span class="en">Beijing</span><small>Nov 20–25</small></button>
    </div>
    <button type="button" class="theme-toggle" id="themeBtn">Night</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Days"></nav>
</header>

<main class="deck" id="deck" aria-live="polite"></main>

<script>

const START = {
  key: "start", color: "#6B7785", ink: "#4A5563", zh: "上海", area: "Before we go", when: "November 2026", line: "Prep", tabTop: "S", tabSub: "Prep",
  eyebrow: "Before we go", title: "Bookings & essentials",
  summary: "Six days based at 627 Nanjing East Rd. Every morning: run at 6:30, then coffee, a light Shanghainese breakfast and a shower in whatever order works. Each day has a suggested local roaster and breakfast; if Dianping shows an indie cafe open early near the run, go there instead.",
  checklist: [
    ["Nov 5", "Buy train tickets Shanghai → Beijing for Nov 20 (12306 app or Trip.com)"],
    ["By Nov 5", "Reserve Eight 八EIGHT for Thu Nov 19 dinner (only 8 seats a night, so book first)"],
    ["By Nov 10", "Reserve Cheng Long Hang for Mon Nov 16 hairy crab dinner (+86 21 6321 2010, or book online via the Michelin page)"],
    ["Nov 17, afternoon", "Optional: call 157 Shi Fang (+86 158 0075 5157) to hold a table for tonight, or just show up early"],
    ["Nov 18", "Lan Xin takes no bookings and is cash only: bring yuan and get in line by 5:30 PM"],
    ["By Nov 10", "Message I-TATTOO for a flash tattoo on Wed Nov 18, around 2 PM"],
    ["By Nov 12", "Book Shanyucaoshe tea for Wed Nov 18, around 4:45 PM"],
    ["By Nov 12", "Book the 2-hour cupping massage for Sun Nov 15, 5:30 PM"],

// Fuller notes, written in our voice. Each "\n" starts a new paragraph.
const RICH = {
  // ---------- Day 1 ----------
  "Fresh-meat mooncakes 鲜肉月饼": "Not the dense sweet mooncakes we know. These are Suzhou-style: flaky, layered pastry wrapped around a juicy seasoned pork filling, baked to order.\nLocals line up for them around Mid-Autumn Festival, but the Nanjing Rd shops sell them all year. Eat it right away while it's hot, or it's just not the same.",
  "Glutinous rice treats": "Shen Da Cheng's thing is sticky rice snacks. The classic to get is 双酿团 (shuang niang tuan): a chewy rice ball rolled in sesame, with red bean and black sesame filling inside.\nThey're sold by the piece, so it's easy to grab one or two and keep walking.",
  "Xiao long bao 小笼包": "THE Shanghai dumpling. The trick is pork aspic (basically meat jelly) folded into the filling, which melts into soup when it's steamed.\nThey come from Nanxiang, a town on Shanghai's northwest edge, around the 1870s.\nHow to eat without burning ourselves: lift it gently by the top knot into the spoon, bite a tiny hole, sip the soup, then dip in the ginger vinegar and eat the rest.",
  "Crab-roe xiao long bao 蟹粉小笼": "The fancy autumn version. 蟹粉 means hairy crab meat and roe, mixed into or replacing the pork filling, so the soup comes out rich, orange and a little sweet.\nCrab season runs roughly September to December, so November is perfect timing. Expect it to cost a few times more than the regular ones. Worth it at least once.",
  "Zhen Lao Da Fang 真老大房": "A long-running Shanghai pastry brand, and the Nanjing Rd shop is the famous one for fresh-meat mooncakes. In our notes: potential for a long line.\nThe line usually moves fast because they're baking nonstop. Order at the window, pay with Alipay, and eat on the street like everyone else.",
  "Shen Da Cheng 沈大成": "A pastry shop with about 150 years of history (founded in the 1870s), known for traditional Jiangnan sticky rice snacks and cakes.\nGood for a little sweet thing after the mooncake. The glass counters show everything, so we can just point.",
  "Nanxiang Steamed Bun 南翔馒头店": "Founded in 1900, and it's the name everyone links with xiao long bao. Still a constant line out the door.\nTip from our notes: go upstairs to sit down. The menu up there is different from the takeaway window downstairs, and the dining room was refurbished in 2018 so it's nice and airy.\nTry the seasonal fillings, and if we're feeling silly, the oversized \"super\" bun we drink with a straw. Going at 10:30 should beat the lunch rush.",
  "1/10 Coffee Roaster": "Opened by coffee nerds who roast their beans right there in the shop, so it's about as local as it gets. They carry a wider range of beans than most places.\nIt's a chill spot overlooking a little park. Good place to sit down after the Yu Garden crowds before tea.",
  "Mu Chun 沐春茶舍": "Our tea house for Day 1, inside Sinan Mansion's restored old villas.\nHow tea houses work here: we pick a tea (oolong, pu'er, white or green), they brew it in front of us and keep topping up hot water, and we can stay a while. Little snacks usually come with it. Ask them to recommend something local, like a Longjing green tea from nearby Hangzhou.",
  "De Xing Guan 德兴馆": "One of the oldest names in Shanghai food, founded in 1878, and on our list (it's also famous for its mooncakes). The Guangdong Rd flagship is in the Michelin Guide.\nDownstairs is the classic noodle-and-rice hall; upstairs is a comfier dining room for Shanghai home-style cooking: cold dishes, hot dishes, soups, noodles and dim sum. The noodles and dim sum are made in-house, and the kitchen starts at 4 AM.\nMichelin's picks are the 两鲜面 and 三鲜面 (mixed-topping noodles, which can include seafood), so for us it's braised pork noodles 焖肉面. A 5-minute walk from the Bund.",
  "Cupping 拔罐": "A traditional Chinese medicine therapy that's over 2,000 years old. Cups are put on the back with suction, which pulls the skin up and is supposed to boost circulation and loosen tight muscles.\nIt leaves round red-purple marks that fade in a few days, so heads up if we're planning any photos! It usually comes with tui na, a firm Chinese massage.\nThe spa from the vid we saw is \"Yu Health\". This stop is a nearby tui na and cupping place, so swap in Yu Health if we find its address.",
  "Nanjing Road": "It started in 1845 as \"Park Lane\" and was renamed Nanking Road in 1862. By the early 1900s it had eight big department stores and was China's most famous shopping street, and a lot of those old buildings are still standing.\nThe East part right by our hotel is pedestrian-only, about 1.2 km of neon signs and crowds. It's best at night when everything's lit up.",
  "The Bund": "The riverside strip of grand old banks and trading houses, mostly built in the 1920s and 30s when Shanghai was Asia's money capital.\nLook for the Peace Hotel (green pyramid roof, 1929), the old HSBC building with its domed mosaic ceiling, and the Customs House clock tower.\nAcross the river is Lujiazui, which was basically farmland until the 1990s. The view is best at night, and the lights usually go off around 10–11 PM.",
  "Yu Garden": "A private garden that Ming dynasty official Pan Yunduan started in 1559 for his father, Pan En, to enjoy in old age. Work stalled when Pan was posted to Sichuan, so it wasn't done until around 1577, almost 20 years later.\nLater it was the headquarters of the Small Swords Society uprising (1853–55), got badly damaged, and was restored in 1956–61.\nWhat to look for: the huge rockeries, koi ponds, the walls with dragons running along the top, and the Exquisite Jade Rock, a 3.3 m, 5-ton stone full of holes.\nIn our notes: must go before 9am. The garden itself opens around 9:00, but the bazaar streets around it are open earlier, so we can wander first and be at the gate when it opens.",
  "Shanghai Old Street 上海老街": "The 825 m stretch of Fangbang Middle Rd running past Yu Garden, inside what used to be the walled old city. It was restored as a showcase of old Shanghai streetscapes, and the two ends look different on purpose.\nThe east end is late Qing and early Republican: checkered windows, wooden shop boards and upturned eaves. The west end is Ming and Qing style, with black tiles, whitewashed walls and red columns, plus antique and curio shops and teahouses.\nIt's touristy, but it's the easiest way to see traditional Shanghai architecture in one walk. Old-name shops to spot include Tonghanchun (traditional medicine), Wuliangcai and Old Shanghai Tea House.",
  "Nine-Turn Bridge": "The zigzag bridge across Yu Garden's lake. The story is that evil spirits can only travel in straight lines, so the zigzags keep them out.\nIt gets packed fast, which is another reason to go early.",
  "Sinan Mansion": "A block of restored 1920s–30s garden villas from the French Concession days, now cafes, shops and a boutique hotel.\nThe area had famous neighbors back in the day: Zhou Enlai's old Shanghai residence and opera star Mei Lanfang's home are both on Sinan Rd. It's a really pretty stroll, especially with the trees changing color in November.",
  "Fuxing Park": "Opened in 1909 as the French Park, with a formal French-style garden.\nToday it's full of locals doing their thing: dancing, tai chi, playing cards and mahjong, and singing. Just sit on a bench and people-watch. There's also a big statue of Marx and Engels in there, which is kind of random and fun to find.",
  // ---------- Day 2 ----------
  "Shanghai street breakfast": "Locals call the classic breakfast combo the \"four heavenly kings\" (四大金刚): sesame flatbread (大饼), a fried dough stick (油条), a sticky rice roll (粢饭团) and soy milk (豆浆).\nYou can get soy milk sweet (甜) or salty (咸). Salty comes with toppings and is very Shanghai, so it's worth trying once. Pick one or two things to keep it light.",
  "Fried thick noodles 上海粗炒": "Thick, chewy wheat noodles stir-fried with dark soy, shredded pork and greens until they're glossy and a little smoky.\nA cheap, filling, very everyday Shanghai lunch. It's easy to find around the malls on Century Ave.",
  "Big wontons 荠菜大馄饨": "Shanghai has two styles of wontons, and these are the big ones: plump, stuffed with pork and shepherd's purse (a wild green), and served in a light broth.\nThe small style (小馄饨) is tiny, silky and almost all skin. Fun to try both during the trip.",
  "Sesame noodles 麻酱面": "Noodles tossed in a thick sesame paste sauce with a bit of soy, vinegar and sugar. It's a Shanghai classic, usually eaten cold or room temperature.\nMix it really well before eating so every noodle gets coated.",
  "Always Coffee Roaster": "Our pick: a local roaster on Jiujiang Rd, about a minute from the East Nanjing Rd metro. Super close to the hotel, so it's an easy first stop on the way out.\nSince they roast their own beans, it's a good place to buy a bag to bring home.",
  "Wei Xiang Zhai 味香斋": "An old-school noodle shop famous for what some call Shanghai's best sesame noodles. It's Michelin selected.\nIn our notes: some people say it's overhyped? It's cheap and quick though, so worth trying ourselves and deciding. Expect a plain, busy, local room. That's part of the charm.",
  "Waibaidu Bridge": "China's first all-steel bridge, opened on 20 January 1908 where Suzhou Creek meets the Huangpu. It replaced Wills' Bridge, an 1856 wooden toll bridge.\nIt's also called the Garden Bridge, after the Public Garden next to it, and it's the only surviving camelback truss bridge in China. It's in Empire of the Sun and Lust, Caution. In 2008 they actually floated it away on boats to repair it, and it was back in April 2009.",
  "Shanghai Museum East": "The Shanghai Museum's huge new Pudong building, fully opened in 2024. It's where the famous collection lives now: ancient bronzes, ceramics, jade, and painting and calligraphy, plus galleries on the Jiangnan region's culture.\nFree, and normally walk-in with a passport. It's one of the few museums open on Mondays. It's big, so pick a few galleries rather than trying to see everything.",
  "Lujiazui": "Pudong's financial district. The wild part is that it was fields and warehouses until development kicked off in 1990.\nThe skyline: the pink-ball Oriental Pearl Tower (1994), Jin Mao Tower (1999), the \"bottle opener\" Shanghai World Financial Center (2008), and the twisting Shanghai Tower, China's tallest building at 632 m.",
  "Museum of Art Pudong": "An art museum right on the river facing the Bund, designed by French architect Jean Nouvel and opened in 2021. It does big international shows, often with partners like Tate in London.\nEven if the exhibition isn't our thing, some of the galleries have huge windows framing the Bund. It's open late, so it's great around sunset.",
  "Century Park": "Pudong's biggest park, opened in 2000, with a huge lake, lawns and long paths. We can rent bikes or little boats if we want.\nIt's right by the museum, so it's a nice way to walk off a long museum morning.",
  // ---------- Day 3 ----------
  "Vegetable buns 菜馒头": "Fluffy steamed buns filled with finely chopped greens (usually bok choy) and mushrooms, sometimes with a bit of tofu. Simple but so good.\nIn our screenshot list, Wangjiasha's 菜馒头 is the one to get.",
  "Hong shao rou 红烧肉": "Red-braised pork belly: chunks slow-cooked for hours in soy sauce, rock sugar and Shaoxing wine until it's glossy, sticky and melts in our mouth.\nShanghai's version is sweeter and darker than the rest of China's, and it's the dish that defines local cooking (本帮菜). Order rice with it, it's rich.",
  "Smoked fish 熏鱼": "Funny name, because it's not actually smoked. Slices of fish (often carp) are fried until crisp, then soaked in a sweet, spiced soy glaze.\nIt's served cold as a starter, and every Shanghai banquet and holiday table has it.",
  "Kao fu 烤麸": "Spongy wheat gluten cubes braised with wood ear mushrooms, peanuts and lily buds in a sweet-savory soy sauce, served cold.\nIt comes from Buddhist vegetarian cooking and is a Lunar New Year favorite. The gluten soaks up all the sauce, so it's way better than it sounds.",
  "Single Origin Roasters": "Started in south Shanghai and moved downtown in 2017. True to the name, they focus on single-origin beans (lots of Ethiopian) and roast them in-house.\nA proper coffee-nerd spot, and it's on the way to Jing'an Temple. Ask what they're roasting that week.",
  "Zhangshifu": "In our notes: a mom-and-pop local Shanghainese breakfast spot, highly recommended.\nThere's no fancy menu here, so the move is to look at what the regulars are eating and point. Usually it's soy milk, rice rolls, fried dough sticks and maybe wontons. Cash is rare, so have Alipay ready.",
  "Wangjiasha 王家沙": "A Shanghai snack institution that's been around since the 1940s, right on Nanjing West Rd. Famous for vegetable buns, shrimp wontons and their crab soup dumplings in season.\nIt's busy and a bit chaotic: order and pay at the counter first, then grab a seat.",
  "157 Shi Fang 157食坊": "A Michelin Bib Gourmand (good food, good value) that's been a go-to for traditional Shanghainese for years. It moved into a bright new space in the IM Shanghai complex, but the menu is still handwritten like the old days.\nMichelin says the eel claypot rice is a must: plump, oily eel over pearl rice that gets crispy on the bottom. The oil-blanched shrimp get a shout-out too for their wok hei.\nNo foreign credit cards, so have Alipay ready. Going right at opening is our move instead of booking.",
  "People's Park & Square": "This whole area used to be the Shanghai Race Club's racecourse, the center of colonial-era social life. The old clubhouse with the clock tower is now the Shanghai History Museum.\nOn weekends, roughly noon to 5 PM, People's Park has the famous \"marriage market\": parents and grandparents line the paths with their kids' profiles (age, height, job, income, sometimes a photo) pinned to umbrellas, trying to find them a match. The kids themselves are rarely there! We land on a Sunday, so we can actually catch it.",
  "Jing'an Temple": "A Buddhist temple with roots going back to the 3rd century. It moved to this spot in 1216, and the old road out front used to be called Bubbling Well Road after the temple's well.\nThe gold-roofed halls are mostly a modern rebuild, sitting right between malls and skyscrapers, which is such a Shanghai contrast. Try tossing a coin into the top of the big incense burner in the courtyard. Landing it is supposed to be good luck. There's a small entry fee.",
  "M50": "Old textile mills along Suzhou Creek that artists started taking over around 2000, which made it the original home of Shanghai's contemporary art scene.\nNow it's galleries, artist studios and indie design shops. Walk Moganshan Rd for the graffiti wall too. Many galleries close Mondays, but Tuesday is fine.",
  "West Nanjing Rd": "The fancy end of Nanjing Rd, lined with luxury malls (Plaza 66, Jing'an Kerry Centre, Taikoo Hui) and flagship stores.\nIt was once called Bubbling Well Road, after Jing'an Temple's well. Good for shopping, and for ducking into the side lanes to see the old lane houses.",
  // ---------- Day 4 ----------
  "Da bing 大饼": "A flaky sesame flatbread baked stuck to the inside wall of a hot clay oven. It comes savory with scallion or sweet.\nOne of the \"four heavenly kings\" of Shanghai breakfast. Grab it fresh and hot with a soy milk.",
  "Shepherd's purse 荠菜": "A slightly peppery wild green that Shanghainese people love, especially in cooler months. It's usually chopped into dumplings and wontons with pork.\nIt tastes fresh and a bit grassy, and it's very Jiangnan.",
  "Cheng Long Hang 成隆行蟹王府": "\"A household name among hairy crab lovers\", says Michelin, which gives it one star. It runs its own crab farm, so the supply and quality stay steady, and the shells come packed with creamy yellow roe.\nMichelin's picks: drunken crabs steeped in Shaoxing wine for a month, and a steamed meringue on a stuffed crab shell that uses the meat and roe of three crabs per serving. It's on Jiujiang Rd, about 5 minutes from the hotel. Book ahead.",
  "Lao Xing Xian 老兴鲜": "A Michelin Guide pick on the 5th floor of the Parkson mall on Huaihai Rd, ticked on our list. It's Shanghainese with a seafood leaning plus a few Cantonese classics, so there's plenty that isn't fish.\nIt's our walk-in backup for hairy crab night: they take bookings, but as a big mall restaurant, showing up early should be fine.",
  "Hairy crab 大闸蟹": "Chinese mitten crab, called \"hairy\" because of the fuzz on its claws. It's THE autumn obsession here, especially crab from nearby Yangcheng Lake.\nInsider tip: by the lunar calendar, females are best in the 9th month (roughly October) for the roe, and males get fattier and creamier in the 10th (roughly November), so ask for a male (公蟹). Heads up: way more \"Yangcheng Lake\" crab gets sold than the lake produces, so a lot is fake. It comes steamed and whole with ginger vinegar, and often warm yellow wine to \"balance\" it.\nEating it is a whole process, so don't be shy asking staff to show us how to crack it.",
  "Wunder": "A one-shop roaster run by a former barista turned roaster. The owner closes every Monday just to roast, timing each batch so it hits its best flavor.\nKnown for traditional Italian-style coffee. It's a tiny neighborhood spot and a great first stop before shopping.",
  "Wu You Xian 屋有鲜": "A xiao long bao specialist from our screenshot list, known for seasonal fillings: crab in autumn and shepherd's purse in the cooler months.\nIt's on South Maoming Rd, right in the French Concession, so it's perfect to slot in between shopping and the tattoo.",
  "Shanyucaoshe 山余草舍": "Our must-do tea house, tucked inside Rose Villa, a lane of old garden villas off Fuxing West Rd.\nIt's the kind of tea house that's about the setting and slowing down: pick a tea, let them walk us through it, and just hang out. Book ahead if we can, since it's popular.",
  "Lan Xin 兰心": "A tiny Michelin Bib Gourmand on Jinxian Rd in what used to be a private home. Michelin tags it \"worth queueing for\", and the line often goes down the street, since it doesn't take bookings.\nIt's traditional home-style Shanghainese. Michelin's picks are the braised pork, the braised duck in brown sauce, and a sweet-and-sour yellow croaker (skip that one). Cash only, so bring yuan.\nIf the line is crazy, Mao Long next door at 134 Jinxian Rd is another Bib Gourmand that's especially proud of its braised pork.",
  "Cozy Music Lab": "One of our non-negotiables: the live music bar for the trip.\nCheck its WeChat or Dianping the day before for who's playing and what time the music starts. Shanghai bar gigs often don't get going until 9 or 10.",
  "I-TATTOO": "A big studio on Panyu Rd with lots of artists across different styles and price points. It's also a gallery and bar that's all about tattoo culture in China.\nMessage ahead to ask about flash designs, walk-ins and payment. Bring the design idea saved on our phone.",
  "Yibo Studio": "From our list: a hands-on workshop where we make our own glass jewelry to take home.\nSuch a good souvenir. Check how long a session takes when booking, in case the tattoo runs long.",
  "Salomon \"Fu Jun\"": "Salomon's first China concept store, called \"Fu Jun\", in a century-old French-style villa. It's inspired by their store in Paris's Marais.\nThree floors, with limited drops and collabs with local artists. Open 10:00–22:00.",
  "Musinsa Store": "Musinsa is Korea's biggest fashion platform, and this Anfu Rd store (opened December 2025) is their multi-brand concept store, in a 100-year-old three-story building.\nAround 40 Korean and Chinese brands under one roof. For basics, their Musinsa Standard flagship is about 2 km away at Parkson, 918 Middle Huaihai Rd.",
  "Deja Vu Recycle": "A really popular secondhand store in an old film-distribution company building. Books are downstairs, displayed in crates like a greengrocer, and 2,000+ pre-owned clothes are upstairs.\nIt's famous for its design, so it's a good photo stop too. There's a bigger branch at Hongqiao Tiandi, but this one's on our route.",
  "Harmay 话梅": "A warehouse-style beauty store: shelves of 100+ brands stacked like inventory, plus lots of travel sizes and discounted items.\nHeads up: the old Anfu Rd shop closed in July 2026 and moved across the road to 55 Wukang Rd. Open 10:00–22:00.",
  "Xintiandi 新天地": "Restored shikumen (\"stone gate\") lane houses, a very Shanghai style of housing, turned into a dining and shopping area. We pass through on the run.\nFun history: the Communist Party's first national congress was held in one of these houses in 1921, and there's a museum there now.",
  "Former French Concession": "The part of the city France ran from 1849 to 1943. It's why the streets are lined with plane trees, garden villas and lane houses.\nIt's now Shanghai's coolest area for cafes, boutiques and just wandering. In November the plane trees go yellow, so it's prime time.",
  "Wukang Building": "The flatiron-shaped apartment building at the corner of Wukang Rd and Huaihai Rd, designed by Hungarian-Slovak architect László Hudec and finished in 1924. Its original name was the Normandie Apartments.\nFilm stars lived here after 1949, and now it's probably the most photographed building in the city. Best photo spot is from across the intersection.",
  "Rose Villa 玫瑰别墅": "A quiet lane of old garden villas off Fuxing West Rd, right in the heart of the French Concession, where Shanyucaoshe sits.\nIt's a nice escape from the busy shopping streets just a few blocks away.",
  // ---------- Day 5 ----------
  "Jianbing 煎饼": "A street-stall crepe: batter spread thin on a hot griddle, cracked egg, scallion, cilantro, sweet bean and chili sauce, with a crispy cracker folded inside.\nIt's originally from northern China but now everywhere. Say 不要辣 (bu yao la) if we don't want it spicy.",
  "Yellow croaker noodles 黄鱼面": "Noodles in a milky-white broth made by boiling fish bones for hours, topped with tender pieces of yellow croaker.\nThe fish comes from the East China Sea and has long been a favorite in Shanghai and nearby Ningbo. Super comforting, and it's on our must-eat list.",
  "Aftertaste": "Our pick: an independent cafe in Qiantan, Pudong's newer riverside area.\nIt's a different vibe from the old-lane cafes, more modern and open, which works for the bike ride.",
  "Rongjia Huangyu Mian 荣家黄鱼面": "A yellow croaker noodle shop from our screenshot list, under the noodles part.\nDouble check the address in Amap, and order the classic 黄鱼面.",
  "Eight 八EIGHT": "The big dinner! A tiny chef's counter with just eight seats a night and an eight-course tasting menu, around ¥888 each.\nThere's no printed menu: dishes change daily based on what the kitchen gets, mixing Basque, Spanish and East Asian flavors, and the chef serves and explains every course across the counter.\nIt moved from Wuyi Rd and reopened on Yongkang Rd in 2026. Get the reservation locked in!",
  "Qiantan riverside": "Pudong's newer riverside district, across the river from the old West Bund industrial waterfront. It's all new parks, bike paths and the Taikoo Li Qiantan mall.\nIt's flat and smooth, which is great for an easy morning bike ride.",
  "Longhua Temple & Pagoda": "Shanghai's largest Buddhist temple, said to go back to the 3rd century. The seven-story pagoda out front is from 977 in the Song dynasty, one of the oldest things standing in the city.\nThe temple is famous for its New Year's Eve bell ringing. In our notes: the Longhua Square underground space beneath the pagoda is a quiet architectural spot with a small museum and cafe, so no crowds.",
  "West Bund": "The Xuhui riverfront just north of Longhua used to be industrial: docks, wharves and the old Longhua Airport. It's been turned into a long riverside promenade with art museums along it, so it's a nice slow walk right next to the temple.\nThe Long Museum West Bund was founded by collector couple Liu Yiqian and Wang Wei, and the building wraps around an old coal-unloading bridge from the docks days. Check what's showing before going in.",
  "Tianzifang 田子坊": "A maze of shikumen (\"stone gate\") lane houses off Taikang Rd. The core block dates from 1933, and artists moved in for the cheap rent. Painter Huang Yongyu named it, as a pun on Tian Zifang, often called China's earliest recorded artist.\nWhen developers wanted to tear it down in 2006, artist Chen Yifei (who had a studio here) and the residents pushed back. Unlike Xintiandi, it kept its original buildings. Now it's 200+ tiny shops, studios and cafes.",
  "Yongkang Road": "Where tonight's dinner is. It's a narrow French Concession street that used to be a wet market, then turned into a famous expat bar street around 2013.\nThere's a funny local legend about neighbors upstairs throwing water on noisy drinkers below. It's calmer now, with lots of cafes and small bars.",
  // ---------- Day 6 ----------
  "Sheng jian bao 生煎包": "Pan-fried pork buns: fluffy on top, crispy golden bottoms, sesame and scallion sprinkled over, and hot soup inside.\nThey came over from Suzhou in the early 1900s and have been a Shanghai breakfast since the 1920s. Traditionally they're sold in fours, a unit called a \"liang\". Careful, the soup squirts! Bite a tiny corner first and let the steam out.",
  "Scallion oil noodles 葱油拌面": "Simple but so good: thin noodles tossed in oil that's been slowly fried with scallions until they're dark and crispy, plus soy sauce and a little sugar.\nEvery Shanghai noodle shop has it, and locals judge shops by it. One of our must-eats.",
  "Small wontons 小馄饨": "Tiny, thin-skinned wontons in a light broth, usually with dried shrimp, seaweed and scallion.\nThey're almost all silky wrapper, a gentle little side with breakfast.",
  "Dongtaixiang 东泰祥": "A top pick on our screenshot list for sheng jian made with half-leavened dough, so they're slightly thinner and crispier than the fluffy kind.\nThe list also says the scallion oil noodles and small wontons are great here, which knocks out two must-eats on the last morning.",
  "Hongqiao Railway Station": "One of the biggest train stations in Asia, opened in 2010 and connected to the airport and metro.\nThe Beijing–Shanghai high-speed line opened in 2011. It's about 1,300 km, and the fastest trains do it in around 4.5 hours at up to 350 km/h. Bring the same passport we booked with, since they check it at the gates."
};

  d1: "Landing day, so no run! Metro into the city, drop our bags, grab coffee and eat our way down Nanjing East Rd before hitting Yu Garden early to beat the crowds. Soup dumplings for an early lunch and a walk down Old Street for the architecture, then coffee and tea in the French Concession and a lazy stroll through Fuxing Park. Nap, then a 2-hour cupping massage and the Bund all lit up at night.",
  d2: "Museum day! Run the Bund, street breakfast, coffee at Always on the way out, then most of the morning at Shanghai Museum East (open Mondays, when most museums are closed). Walk it off in Century Park, catch sunset across the river from the Bund, and end with our hairy crab dinner near the hotel.",
  d3: "Artsy day + shopping round 1. Run west to a proper local breakfast at Zhangshifu, then after the shower, coffee at Single Origin Roasters and the golden Jing'an Temple, buns at Wangjiasha, galleries at M50, and an afternoon on West Nanjing Rd with a sheng jian and scallion oil noodle snack. Dinner at 157 Shi Fang, a Michelin Bib Gourmand: hong shao rou, kao fu and whatever else looks good. Don't forget: book the Forbidden City at 8 PM!",
  d4: "Shopping round 2 in the French Concession. Coffee at Wunder to kick it off, then Salomon, Musinsa, Deja Vu and Harmay on Anfu and Wukang Rd, pork and shepherd's purse soup dumplings for lunch, then the flash tattoo and making glass jewelry. Tea at Shanyucaoshe in Rose Villa, braised pork and duck at Lan Xin, and live music at Cozy Music Lab to close it out.",
  d5: "A slower, greener day down south. Short run, then bike the Qiantan riverside to coffee at Aftertaste, then Longhua Temple and the quiet underground space under the pagoda. Yellow croaker noodles, the West Bund art riverfront next door, and a wander through Tianzifang's lanes, before the big one: dinner at Eight's 8-seat chef's counter.",
  d6: "Last morning! One more Bund run, then sheng jian bao and scallion oil noodles, the two must-eats we saved for the end. Pack, a last cup at Always (buy beans to take home), check out, and Line 2 straight to Hongqiao for the train to Beijing."

function panelHead(title, sub) {
  return `<summary><span><span class="ttl">${title}</span><span class="sub">${sub}</span></span><span class="plus" aria-hidden="true">+</span></summary>`;
}
const PANEL_SUB = {
  "Today's food, explained": "The dishes we're eating and where they come from",
  "Where we're eating & drinking": "What each restaurant, cafe and tea house is known for",
  "Where we're shopping": "The stores on today's route",
  "Today's sights, explained": "Quick history of what we're seeing"
};
function notesBlock(title, list, intro) {
  if (!list || !list.length) return "";
  return `<details class="panel">${panelHead(title, PANEL_SUB[title] || "")}
    <div class="notes">${intro ? `<div class="intro-note">${esc(intro)}</div>` : ""}
    ${list.map(([n, t]) => `<div class="note"><b>${esc(n)}</b><span>${paras(t)}</span>${srcLink(SRC[n])}</div>`).join("")}</div></details>`;
}

// Attach each place, sight and dish note to the stop it belongs to
const cjk = n => (n.match(/[㐀-鿿]+/g) || []).join("");
const enName = n => n.split(/[㐀-鿿"“(（]/)[0].split(" & ")[0].trim().toLowerCase();
const disp = n => n.replace(/\s*\(.*\)$/, "").trim();
function enrich(days, know) {
  const index = {};
  days.forEach(d => {
    (d.sights || []).forEach(n => index[n[0]] = ["History", ...n]);
    (d.places || []).forEach(n => index[n[0]] = ["Known for", ...n]);
    (d.shopping || []).forEach(n => index[n[0]] = ["Shop", ...n]);
    (d.food.items || []).forEach(n => index[n[0]] = ["The dish", ...n]);
  });
  Object.entries(know).forEach(([dk, m]) => {
    const d = days.find(x => x.key === dk);
    Object.entries(m).forEach(([i, names]) => { if (d.stops[+i]) d.stops[+i].know = names; });
  });
  days.forEach(d => {
    const notes = [
      ...(d.sights || []).map(n => ["History", ...n]),
      ...(d.places || []).map(n => ["Known for", ...n]),
      ...(d.food.items || []).map(n => ["The dish", ...n])
    ];
    d.stops.forEach(s => {
      const hay = (s.title + " " + (s.detail || "")).toLowerCase();
      s.about = notes.filter(([kind, name]) => {
        const en = enName(name), zh = cjk(name);
        if (kind === "The dish") return zh && hay.includes(zh);
        const names = s.title + " " + (s.options || []).map(o => o[0]).join(" ");
        return (en.length >= 3 && names.toLowerCase().includes(en)) || (zh.length > 1 && names.includes(zh));
      });
      (s.know || []).forEach(k => { const hit = index[k]; if (hit && !s.about.includes(hit)) s.about.push(hit); });
    });
  });
}
Object.values(CITIES).forEach(c => enrich(c.days, c.know));

let CITY = "sh";
const amap = k => `https://uri.amap.com/search?keyword=${encodeURIComponent(k)}&city=${CITIES[CITY].code}`;

function aboutHTML(s) {
  if (!s.about || !s.about.length) return "";
  return `<details class="about"><summary>About this place</summary><div class="ab">
    ${s.about.map(([kind, n, t]) => `<div class="ab-item"><b>${esc(disp(n))}</b>${paras(t)}${srcLink(SRC[n])}</div>`).join("")}</div></details>`;
}

function altsHTML(key) {
  const list = CITIES[CITY].alts[key]; if (!list || !list.length) return "";
  const groups = {};
  list.forEach(a => (groups[a[0]] = groups[a[0]] || []).push(a));
  return `<details class="panel">${panelHead("Other options", `${list.length} other ideas if a line is long, it rains, or we want more`)}<div class="alts">
    ${Object.entries(groups).map(([g, items]) => `<div class="alt-group"><h4>${esc(g)}</h4>
      ${items.map(([, n, w, a, k]) => `<div class="alt"><div class="n">${esc(n)}</div><div class="w">${esc(w)}</div>
        ${a ? `<div class="a">${esc(a)}</div>` : ""}
        ${k ? `<div class="actions"><a class="btn" href="${amap(k)}" target="_blank" rel="noopener">${pinIcon}Open in Amap</a></div>` : ""}</div>`).join("")}
    </div>`).join("")}</div></details>`;
}

// Group stops into parts of the day instead of a strict timetable
function partOf(t, prev) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(t);
  if (m) { const h = +m[1]; return h < 11 ? "Morning" : h < 14 ? "Midday" : h < 17 ? "Afternoon" : "Evening"; }
  if (/^(Then|Early|Morning|6:30)$/i.test(t)) return "Morning";
  if (/^(Lunch|Midday)$/i.test(t)) return "Midday";
  if (/^(Afternoon|Later|Day)$/i.test(t)) return prev === "Morning" ? "Afternoon" : prev || "Afternoon";
  if (/^(Dinner|Evening|Night)$/i.test(t)) return "Evening";
  return prev || "Morning";
}
// Food and coffee stops get their own section, grouped by meal
function mealOf(s) {
  if (s.type === "coffee") return "Coffee";
  if (s.type !== "food" && !(s.type === "tbd" && /^(breakfast|lunch|dinner)$/i.test(s.label))) return null;
  const k = (s.t + " " + s.label).toLowerCase();
  if (/breakfast/.test(k)) return "Breakfast";
  if (/snack/.test(k)) return "Snack";
  if (/lunch/.test(k)) return "Lunch";
  if (/dinner/.test(k)) return "Dinner";
  const m = /^(\d{1,2}):/.exec(s.t);
  if (m) return +m[1] < 11 ? "Breakfast" : +m[1] < 15 ? "Lunch" : +m[1] < 17 ? "Snack" : "Dinner";
  return "Snack";
}
const MEALS = [["Breakfast", "早餐"], ["Coffee", "咖啡"], ["Lunch", "午餐"], ["Snack", "小吃"], ["Dinner", "晚餐"]];
function foodHTML(stops) {
  if (!stops.length) return "";
  return `<div class="section food-sec"><h3>Food & coffee</h3>${MEALS.map(([m, zh]) => {
    const list = stops.filter(s => mealOf(s) === m);
    return list.length ? `<section class="part meal"><h4><span>${m}</span><small lang="zh-Hans">${zh}</small></h4><ol class="plan">${list.map(x => stopHTML(x, true)).join("")}</ol></section>` : "";
  }).join("")}</div>`;
}
const PART_ZH = { Morning: "上午", Midday: "中午", Afternoon: "下午", Evening: "晚上" };
function itinHTML(stops) {
  const groups = []; let prev = null;
  stops.forEach(s => {
    let p = partOf(s.t, prev);
    const order = ["Morning", "Midday", "Afternoon", "Evening"];
    if (prev && order.indexOf(p) < order.indexOf(prev)) p = prev;
    if (!groups.length || groups[groups.length - 1][0] !== p) groups.push([p, []]);
    groups[groups.length - 1][1].push(s); prev = p;
  });
  return groups.map(([p, list]) => `<section class="part"><h4><span>${p}</span><small lang="zh-Hans">${PART_ZH[p]}</small></h4><ol class="plan">${list.map(stopHTML).join("")}</ol></section>`).join("");
}

// Today in China: Shanghai until 2 PM on Nov 20 (train day), Beijing after
function todayFor() {
  try {
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date()).map(p => [p.type, p.value]));
    const date = `${parts.year}-${parts.month}-${parts.day}`;
    if (date === "2026-11-20") return +parts.hour < 14 ? ["sh", "d6"] : ["bj", "d1"];
    for (const [ck, c] of Object.entries(CITIES)) { const hit = c.days.find(d => d.date === date); if (hit) return [ck, hit.key]; }
  } catch (e) {}
  return [null, null];
}
const [todayCity, todayKey] = todayFor();

function render(city, idx = 0) {
  CITY = city;
  const C = CITIES[city];
  all = [C.start, aboutOf(C), listOf(C), ...C.days];
  document.title = `${C.name} · China 2026`;
  cityTitle.textContent = `${C.name}, ${C.dates}`;
  switchBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.city === city));
  deck.innerHTML = all.map((d, i) =>
    `<section class="slot" id="card-${city}-${d.key}" data-i="${i}" style="--c:${d.color};--ct:${d.ink};--on:${onColor(d.color)}">${i === 0 ? startCard(C.start, C.info) : i === 1 ? aboutCard(d, C.info) : i === 2 ? listCard(d, C) : dayCard(d, i - 2, C.days.length)}</section>`
  ).join("");
  const tk = todayCity === city ? todayKey : null;
  tabs.innerHTML = all.map((d, i) =>
    `<button class="tab ${d.key === tk ? "today" : ""}" data-i="${i}" style="--tc:${d.color};--to:${onColor(d.color)}" aria-label="${esc(d.when)}, ${esc(d.area)}"><span class="roundel">${i === 0 ? "S" : i === 1 ? "A" : i === 2 ? "L" : i - 2}</span><small>${d.key === tk ? "Today" : (i === 0 ? "Prep" : i === 1 ? "About" : i === 2 ? "List" : d.tabSub + " " + d.tabTop)}</small></button>`
  ).join("");
  slots = [...deck.querySelectorAll(".slot")];
  tabBtns = [...tabs.querySelectorAll(".tab")];
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting && e.intersectionRatio > 0.6) setActive(+e.target.dataset.i); });
  }, { root: deck, threshold: [0.6] });
  slots.forEach(s => io.observe(s));
  requestAnimationFrame(() => { goTo(idx, false); setActive(idx); window.scrollTo(0, 0); });
}

function goTo(i, smooth = true) {
  i = Math.max(0, Math.min(all.length - 1, i));
  deck.scrollTo({ left: slots[i].offsetLeft, behavior: smooth ? "smooth" : "auto" });
}
function setActive(i) {
  current = i;
  slots.forEach((s, k) => s.classList.toggle("away", k !== i));
  tabBtns.forEach((b, k) => b.classList.toggle("active", k === i));
  const tb = tabBtns[i];
  tabs.scrollTo({ left: tb.offsetLeft - (tabs.clientWidth - tb.offsetWidth) / 2, behavior: "smooth" });
  try { history.replaceState(null, "", `#${CITY}-${all[i].key}`); } catch (e) {}
}

  let city = "sh", key = null;

  else if (todayCity) { city = todayCity; key = todayKey; }
  const list = [CITIES[city].start, aboutOf(CITIES[city]), listOf(CITIES[city]), ...CITIES[city].days];
  render(city, Math.max(0, list.findIndex(d => d.key === key)));
})();
</script>
